        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function tickTimer() {
        if (!timerState.running) {
          stopTimerTicker();
          return;
        }
        syncTimerFromClock(true);
        renderTimerPanel();
      }

      function syncTimerFromClock(playAlarm) {
        if (!timerState.running || !timerState.endAt) {
          return;
        }
        var seconds = Math.max(0, Math.ceil((timerState.endAt - Date.now()) / 1000));
        timerState.remainingSeconds = seconds;
        if (seconds <= 0) {
          expireTimer(playAlarm);
        }
      }

      function expireTimer(playAlarm) {
        if (timerState.expired) {
          return;
        }
        timerState.running = false;
        timerState.expired = true;
        timerState.remainingSeconds = 0;
        timerState.endAt = null;
        timerEditing = false;
        releaseTimerWakeLock();
        stopTimerTicker();
        saveTimerState();
        renderTimerPanel();
        if (playAlarm) {
          playTimerAlarm();
        }
      }

      function toggleTimerPause() {
        if (timerState.expired || timerState.remainingSeconds <= 0) {
          clearTimer();
          return;
        }
        if (timerState.running) {
          pauseTimer(true);
        } else {
          resumeTimer();
        }
      }

      function pauseTimer(shouldRender) {
        syncTimerFromClock(false);
        timerState.running = false;
        timerState.endAt = null;
        releaseTimerWakeLock();
        stopTimerTicker();
        saveTimerState();
        if (shouldRender) {
          renderTimerPanel();
        }
      }

      function resumeTimer() {
        if (!timerState.visible || timerState.remainingSeconds <= 0) {
          renderTimerPanel();
          return;
        }
        unlockTimerAudio();
        timerState.running = true;
        timerState.expired = false;
        timerState.endAt = Date.now() + timerState.remainingSeconds * 1000;
        saveTimerState();
        renderTimerPanel();
        ensureTimerTicker();
        requestTimerWakeLock();
      }

      function beginTimerEdit() {
        if (!timerState.visible || timerState.expired) {
          return;
        }
        timerEditWasRunning = timerState.running;
        pauseTimer(false);
        timerEditing = true;
        renderTimerPanel();
        setTimeout(function () {
          var input = document.getElementById("timerEditInput");
          if (input) {
            input.focus();
            input.select();
          }
        }, 0);
      }

      function confirmTimerEdit() {
        var input = document.getElementById("timerEditInput");
        var seconds = parseTimerSeconds(input ? input.value : "");
        if (seconds == null) {
          showToast("Enter a timer like 16 min, 1:20, or 1 hr 20 min.");
          return;
        }
        timerState.remainingSeconds = seconds;
        timerState.durationSeconds = seconds;
        timerState.expired = false;
        timerState.endAt = null;
        timerEditing = false;
        if (timerEditWasRunning && seconds > 0) {
          resumeTimer();
        } else {
          timerState.running = false;
          saveTimerState();
          renderTimerPanel();
        }
      }

      function cancelTimerEdit() {
        timerEditing = false;
        if (timerEditWasRunning && timerState.remainingSeconds > 0) {
          resumeTimer();
        } else {
          saveTimerState();
          renderTimerPanel();
        }
      }

      function clearTimer() {
        timerEditing = false;
        timerEditWasRunning = false;
        stopTimerAlarmSound();
        releaseTimerWakeLock();
        stopTimerTicker();
        timerState = createEmptyTimerState();
        saveTimerState();
        renderTimerPanel();
      }

      function parseTimerSeconds(value) {
        var text = String(value == null ? "" : value).toLowerCase().trim();
        if (!text) {
          return null;
        }
        if (/^\d+(:\d{1,2}){1,2}$/.test(text)) {
          var parts = text.split(":").map(function (part) { return Number(part); });
          if (parts.some(function (part) { return !Number.isFinite(part); })) {
            return null;
          }
          return parts.length === 3 ?
            parts[0] * 3600 + parts[1] * 60 + parts[2] :
            parts[0] * 60 + parts[1];
        }
        text = text.replace(/(\d+(?:\.\d+)?)\s*(?:-|to)\s*(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min|seconds?|secs?|sec)\b/g, "$2 $3");
        var total = 0;
        var matched = false;
        var pattern = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min|seconds?|secs?|sec)\b/g;
        var match;
        while ((match = pattern.exec(text))) {
          matched = true;
          total += secondsForTimerUnit(Number(match[1]), match[2]);
        }
        if (matched) {
          return Math.max(0, Math.round(total));
        }
        if (/^\d+(?:\.\d+)?$/.test(text)) {
          return Math.round(Number(text) * 60);
        }
        return null;
      }

      function secondsForTimerUnit(value, unit) {
        if (!Number.isFinite(value)) {
          return 0;
        }
        if (/^h/.test(unit)) {
          return value * 3600;
        }
        if (/^s/.test(unit)) {
          return value;
        }
        return value * 60;
      }

      function formatTimerClock(seconds) {
        seconds = Math.max(0, Math.round(Number(seconds) || 0));
        var hours = Math.floor(seconds / 3600);
        var minutes = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;
        if (hours > 0) {
          return hours + ":" + padTimerNumber(minutes) + ":" + padTimerNumber(secs);
        }
        return minutes + ":" + padTimerNumber(secs);
      }

      function padTimerNumber(value) {
        return String(value).padStart(2, "0");
      }

      function unlockTimerAudio() {
        if (typeof window === "undefined") {
          return;
        }
        var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) {
          return;
        }
        try {
          if (!timerAudioContext) {
            timerAudioContext = new AudioContextCtor();
          }
          if (timerAudioContext.state === "suspended" && timerAudioContext.resume) {
            timerAudioContext.resume().catch(function () {});
          }
        } catch (error) {
          timerAudioContext = null;
        }
      }

      function playTimerAlarm() {
        if (alarmInterval || alarmTimeout) {
          return;
        }
        unlockTimerAudio();
        if (!timerAudioContext) {
          return;
        }
        var startSound = function () {
          var startedAt = Date.now();
          var index = 0;
          var tones = [880, 660, 990, 660];
          var beep = function () {
            if (Date.now() - startedAt >= 15000) {
              stopTimerAlarmSound();
              return;
            }
            playTimerTone(tones[index % tones.length], 0.18);
            index += 1;
          };
          beep();
          alarmInterval = setInterval(beep, 420);
          alarmTimeout = setTimeout(stopTimerAlarmSound, 15000);
        };
        if (timerAudioContext.state === "suspended" && timerAudioContext.resume) {
          timerAudioContext.resume().then(startSound).catch(function () {});
        } else {
          startSound();
        }
      }

      function playTimerTone(frequency, durationSeconds) {
        if (!timerAudioContext) {
          return;
        }
        try {
          var oscillator = timerAudioContext.createOscillator();
          var gain = timerAudioContext.createGain();
          var now = timerAudioContext.currentTime;
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSeconds);
          oscillator.connect(gain);
          gain.connect(timerAudioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + durationSeconds + 0.02);
          alarmNodes.push(oscillator);
          oscillator.onended = function () {
            alarmNodes = alarmNodes.filter(function (node) { return node !== oscillator; });
            gain.disconnect();
          };
        } catch (error) {
          // Audio output is best-effort.
        }
      }

      function stopTimerAlarmSound() {
        if (alarmInterval) {
          clearInterval(alarmInterval);
          alarmInterval = null;
        }
        if (alarmTimeout) {
          clearTimeout(alarmTimeout);
          alarmTimeout = null;
        }
        alarmNodes.forEach(function (node) {
          try {
            node.stop();
          } catch (error) {}
        });
        alarmNodes = [];
      }

      async function requestTimerWakeLock() {
        if (!timerState.running || wakeLock || typeof navigator === "undefined" || !navigator.wakeLock || document.visibilityState === "hidden") {
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", function () {
            wakeLock = null;
          });
        } catch (error) {
          wakeLock = null;
        }
      }

      function releaseTimerWakeLock() {
        if (!wakeLock) {
          return;
        }
        var lock = wakeLock;
        wakeLock = null;
        try {
          lock.release().catch(function () {});
        } catch (error) {}
      }

      // Recipe detail is the read-only cooking view; editing swaps in a form
      // for user-facing fields and preserves unedited nested fields.
      function renderDetail(panel) {
        var recipe = getRecipeById(panel.recipeId);
        if (!recipe) {
          mainEl().innerHTML =
            '<section class="detail-panel"><div class="back-row"><button class="ghost-button" type="button" data-action="back">Back</button></div><div class="empty-state">Recipe not found.</div></section>';
          return;
        }
        if (panel.editing) {
          renderEditDetail(recipe);
          return;
        }
        var title = displayValue(recipe.title, "Untitled recipe");
        mainEl().innerHTML =
          '<section class="detail-panel">' +
            '<div class="back-row"><button class="ghost-button" type="button" data-action="back">Back</button></div>' +
            '<div class="detail-layout">' +
              renderDetailImage(recipe) +
              '<div>' +
                '<div class="title-line">' +
                  '<div><h1>' + escapeHtml(title) + '</h1><p class="subtitle">' + escapeHtml(formatRecipeTime(recipe)) + '</p></div>' +
                  '<button class="round-button list-toggle" type="button" data-action="toggle-list" data-recipe-id="' + escapeAttr(recipe.id) + '" aria-label="' + (isInMyList(recipe) ? "Remove from My List" : "Add to My List") + '">' + (isInMyList(recipe) ? "-" : "+") + '</button>' +
                '</div>' +
                renderSource(recipe) +
                '<div class="meta-grid">' + renderRecipeMeta(recipe) + '</div>' +
                renderRatingControl(recipe) +
              '</div>' +
            '</div>' +
            '<div class="detail-sections">' +
              renderChipSection("Meal type", recipe.meal_type) +
              renderChipSection("Tags", recipe.tags) +
              renderListSection("Ingredients", recipe.ingredients) +
              renderListSection("Specialty / less common ingredients", recipe.specialty_or_less_common_ingredients) +
              renderValueSection("Australian shop notes", recipe.australian_shop_notes) +
              renderListSection("Equipment", recipe.equipment) +
              renderMethodSteps(recipe) +
              renderValueSection("Make-ahead / storage", recipe.make_ahead_or_storage) +
              renderListSection("Beginner notes", recipe.beginner_notes) +
              renderUserNotes(recipe) +
              renderAirFryer(recipe.air_fryer) +
            '</div>' +
            '<div class="detail-bottom-actions"><button type="button" class="text-button" data-action="edit-recipe" data-recipe-id="' + escapeAttr(recipe.id) + '">Edit</button></div>' +
          '</section>';
      }

      function renderDetailImage(recipe) {
        var title = displayValue(recipe.title, "Recipe");
        var color = stableRecipeColor(recipe);
        if (!recipe.image_path) {
          return '<div class="detail-image-placeholder" style="background: ' + color + ';">' + escapeHtml(title) + '</div>';
        }
        return (
          '<div class="detail-image-wrap" data-fallback-title="' + escapeAttr(title) + '" data-fallback-color="' + escapeAttr(color) + '">' +
            '<img src="' + escapeAttr(recipe.image_path) + '" alt="' + escapeAttr(title) + '">' +
          '</div>'
        );
      }

      function renderDetailImagePlaceholderElement(title, color) {
        var div = document.createElement("div");
        div.className = "detail-image-placeholder";
        div.style.background = color || "#302a25";
        div.textContent = title || "Recipe";
        return div;
      }

      function renderSource(recipe) {
        var name = recipe.source_name ? escapeHtml(recipe.source_name) : "";
        var url = recipe.source_url ? String(recipe.source_url) : "";
        if (!name && !url) {
          return "";
        }
        if (url) {
          return '<p class="muted">Source: <a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + (name || escapeHtml(url)) + '</a></p>';
        }
        return '<p class="muted">Source: ' + name + '</p>';
      }

      function renderRecipeMeta(recipe) {
        var bits = [];
        addMeta(bits, "Servings", recipe.servings);
        addMeta(bits, "Difficulty", recipe.difficulty);
        addMeta(bits, "Speed", recipe.speed);
        addMeta(bits, "Budget", recipe.budget);
        addMeta(bits, "Commonness", recipe.commonness);
        addMeta(bits, "Cuisine", recipe.cuisine);
        return bits.join("");
      }

      function addMeta(bits, label, value) {
        if (hasContent(value)) {
          bits.push('<span class="chip">' + escapeHtml(label + ": " + displayValue(value, "")) + '</span>');
        }
      }

      function renderRatingControl(recipe) {
        var rating = getRating(recipe);
        var buttons = "";
        for (var i = 1; i <= 5; i += 1) {
          var fill = rating >= i ? 100 : (rating >= i - 0.5 ? 50 : 0);
          buttons +=
            '<button type="button" class="star-button" data-action="set-rating" data-recipe-id="' + escapeAttr(recipe.id) + '" data-star-index="' + i + '" aria-label="Set rating around ' + i + ' stars">' +
              '<span class="star" style="--fill: ' + fill + '%;">★</span>' +
            '</button>';
        }
        return (
          '<div class="rating-control" aria-label="Recipe rating">' +
            '<span class="muted">Rating</span>' +
            '<span>' + buttons + '</span>' +
            '<span class="muted">' + rating.toFixed(rating % 1 ? 1 : 0) + '/5</span>' +
            '<button type="button" class="ghost-button" data-action="clear-rating" data-recipe-id="' + escapeAttr(recipe.id) + '">Clear</button>' +
          '</div>'
        );
      }

      function renderStars(value) {
        var rating = clampRating(value);
        var out = '<span class="stars" aria-label="' + rating + ' out of 5 stars">';
        for (var i = 1; i <= 5; i += 1) {
          var fill = rating >= i ? 100 : (rating >= i - 0.5 ? 50 : 0);
          out += '<span class="star" style="--fill: ' + fill + '%;">★</span>';
        }
        return out + '</span>';
      }

      function renderChipSection(title, values) {
        var items = asArray(values);
        if (!items.length) {
          return "";
        }
        return (
          '<section class="detail-section"><h2>' + escapeHtml(title) + '</h2>' +
            '<div class="chip-list">' + items.map(function (item) {
              return '<span class="chip">' + escapeHtml(item) + '</span>';
            }).join("") + '</div>' +
          '</section>'
        );
      }

      function renderListSection(title, values) {
        var items = asArray(values);
        if (!items.length) {
          return "";
        }
        return (
          '<section class="detail-section"><h2>' + escapeHtml(title) + '</h2>' +
            '<ul class="plain-list">' + items.map(function (item) {
              return '<li>' + escapeHtml(item) + '</li>';
            }).join("") + '</ul>' +
          '</section>'
        );
      }

      function renderValueSection(title, value) {
        if (!hasContent(value)) {
          return "";
        }
        if (Array.isArray(value)) {
          return renderListSection(title, value);
        }
        if (typeof value === "object") {
          return '<section class="detail-section"><h2>' + escapeHtml(title) + '</h2>' + renderObject(value) + '</section>';
        }
        return '<section class="detail-section"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(value) + '</p></section>';
      }

      function renderUserNotes(recipe) {
        var fields = recipe.user_fields || {};
        var rows = [];
        if (hasContent(fields.my_notes)) {
          rows.push("<p><strong>User notes:</strong> " + escapeHtml(fields.my_notes) + "</p>");
        }
        if (hasContent(fields.note_to_future_me)) {
          rows.push("<p><strong>Note to future self:</strong> " + escapeHtml(fields.note_to_future_me) + "</p>");
        }
        if (asArray(fields.changes_to_try_next_time).length) {
          rows.push("<p><strong>Changes to try next time:</strong></p><ul class=\"plain-list\">" + asArray(fields.changes_to_try_next_time).map(function (item) {
            return "<li>" + escapeHtml(item) + "</li>";
          }).join("") + "</ul>");
        }
        if (!rows.length) {
          rows.push('<p class="muted">No user notes yet.</p>');
        }
        return '<section class="detail-section"><h2>User notes / note to future self</h2>' + rows.join("") + '</section>';
      }

      function renderAirFryer(airFryer) {
        if (!hasContent(airFryer)) {
          return "";
        }
        return '<section class="detail-section"><h2>Air fryer note</h2>' + renderObject(airFryer) + '</section>';
      }

      function renderMethodSteps(recipe) {
        var items = Array.isArray(recipe && recipe.method_steps) ? recipe.method_steps : [];
        if (!items.length) {
          return "";
        }
        return (
          '<section class="detail-section method-section">' +
            '<h2>Method</h2>' +
            '<ol class="method-list">' + items.map(function (step, index) {
              return '<li class="method-step">' + renderMethodStep(recipe, step, index) + '</li>';
            }).join("") + '</ol>' +
          '</section>'
        );
      }

      function renderMethodStep(recipe, step, index) {
        step = step || {};
        var meta = [];
        if (toNumber(step.time_minutes) > 0) {
          meta.push('<span class="chip">Time: ' + escapeHtml(formatMinutes(toNumber(step.time_minutes))) + '</span>');
        }
        if (hasContent(step.temperature_c)) {
          meta.push('<span class="chip">Temp: ' + escapeHtml(step.temperature_c) + ' C</span>');
        }
        if (hasContent(step.heat_level)) {
          meta.push('<span class="chip">Heat: ' + escapeHtml(step.heat_level) + '</span>');
        }
        var out =
          '<div class="method-step-head">' +
            '<p>' + escapeHtml(step.instruction || "Step") + '</p>' +
            renderStepTimerButton(recipe, step, index) +
          '</div>';
        if (meta.length) {
          out += '<div class="step-meta">' + meta.join("") + '</div>';
        }
        if (hasContent(step.visual_or_texture_cue)) {
          out += '<p class="step-note"><strong>Visual / texture cue:</strong> ' + escapeHtml(step.visual_or_texture_cue) + '</p>';
        }
        if (hasContent(step.beginner_tip)) {

      function renderStepTimerButton(recipe, step, index) {
        var minutes = toNumber(step && step.time_minutes);
        if (minutes <= 0) {
          return "";
        }
        return (
          '<button class="round-button timer-button step-timer-button" type="button" data-action="start-step-timer" data-recipe-id="' + escapeAttr(recipe.id) + '" data-step-index="' + escapeAttr(index) + '" aria-label="Start timer for step ' + escapeAttr(index + 1) + ', ' + escapeAttr(formatStepTimerDuration(minutes)) + '" title="Start step timer">' +
            renderTimerIcon() +
          '</button>'
        );
      }

      function formatStepTimerDuration(minutes) {
        var seconds = Math.max(1, Math.round(toNumber(minutes) * 60));
        if (seconds < 60) {
          return seconds + " sec";
        }
        var wholeMinutes = Math.floor(seconds / 60);
        var remainingSeconds = seconds % 60;
        if (!remainingSeconds) {
          return formatMinutes(wholeMinutes);
        }
        var hours = Math.floor(wholeMinutes / 60);
        var minutePart = wholeMinutes % 60;
        var parts = [];
        if (hours) {
          parts.push(hours + " hr");
        }
        if (minutePart) {
          parts.push(minutePart + " min");
        }
        parts.push(remainingSeconds + " sec");
        return parts.join(" ");
      }

      function renderStepAirFryer(step) {
        var bits = [];
        Object.keys(step || {}).forEach(function (key) {
          if (key.toLowerCase().indexOf("air_fryer") !== -1 && hasContent(step[key])) {
            bits.push('<div><strong>' + escapeHtml(formatKey(key)) + ':</strong> ' + renderInlineValue(step[key]) + '</div>');
          }
        });
        if (!bits.length) {
          return "";
        }
        return '<div class="step-note"><strong>Air fryer:</strong>' + bits.join("") + '</div>';
      }

      function renderObject(obj) {
        if (!obj || typeof obj !== "object") {
          return '<p>' + escapeHtml(displayValue(obj, "")) + '</p>';
        }
        var rows = Object.keys(obj).filter(function (key) {
          return hasContent(obj[key]);
        }).map(function (key) {
          return '<div class="object-row"><strong>' + escapeHtml(formatKey(key)) + '</strong><span>' + renderInlineValue(obj[key]) + '</span></div>';
        }).join("");
        return rows ? '<div class="object-grid">' + rows + '</div>' : '<p class="muted">No details.</p>';
      }

      function renderInlineValue(value) {
        if (Array.isArray(value)) {
          return escapeHtml(value.map(function (item) { return displayValue(item, ""); }).join(", "));
        }
        if (value && typeof value === "object") {
          return renderObject(value);
        }
        if (typeof value === "boolean") {
          return value ? "Yes" : "No";
        }
        return escapeHtml(displayValue(value, ""));
      }

          return {
            item: item,
            score: scoreIngredientSuggestion(item, query, canonicalQuery)
          };
        }).filter(function (result) {
          return result.score > 0 && !selectedKeys.has(result.item.key);
        }).sort(function (a, b) {
          return b.score - a.score || a.item.label.localeCompare(b.item.label);
        }).slice(0, 10).map(function (result) {
          return {

            label: suggestionDisplayLabel(result.item, query)

          { title: "Missing only pantry staples", items: [] },
          { title: "Missing 1-2 ingredients", items: [] },
          { title: "Partial matches", items: [] }
        ];
        scored.forEach(function (item) {
          if (item.missingNonPantryCount === 0 && (kitchen.pantryAssumed || item.missingPantryCount === 0)) {
            groups[0].items.push(item);
          } else if (item.missingNonPantryCount === 0 && item.missingPantryCount > 0) {
            groups[1].items.push(item);

            groups[2].items.push(item);

      function previewIngredientLabels(items, fallback) {
        var labels = items.slice(0, 5).map(function (item) { return item.label; });
        var extra = items.length - labels.length;
        if (!labels.length) {
          return fallback;
        }
        return labels.join(", ") + (extra > 0 ? " +" + extra + " more" : "");

      function triggerImport() {
        fileInput.value = "";

      }

      async function handleFileImport(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        try {
          var text = await readFileText(file);
          var data = JSON.parse(text);
          if (!data || !Array.isArray(data.recipes)) {
            throw new Error("The selected JSON does not contain a top-level recipes array.");
          }
          state.data = ensureCatalogue(data);
          resetKitchenSession();
          rebuildKitchenIndex();
          navStack = [];
          saveState("Imported " + state.data.recipes.length + " recipes.");
          renderPanel({ type: "home" }, false);
        } catch (error) {
          showToast(error.message || "Could not import that JSON file.");
        }
      }

      function readFileText(file) {
        if (file.text) {
          return file.text();
        }
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result || "")); };
          reader.onerror = function () { reject(reader.error || new Error("Could not read file.")); };
          reader.readAsText(file);
        });
      }

      // Export writes the current merged catalogue, including ratings, edits,
      // notes, and My List flags, through the browser download flow.
      function exportData() {
        if (!state.data) {
          showToast("No catalogue is loaded.");
          return;
        }
        var data = JSON.parse(JSON.stringify(state.data));
        data.recipe_count = Array.isArray(data.recipes) ? data.recipes.length : 0;
        data.meta = Object.assign({}, data.meta || {}, {
          exported_at: new Date().toISOString(),
          exported_by: "Cooking Journal offline app"
        });
        var today = new Date().toISOString().slice(0, 10);
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = EXPORT_PREFIX + today + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 500);
        showToast("Export started.");
      }

        resetKitchenIndex();
        showToast("Local data cleared.");
        renderImportPanel("Local data was cleared. Import " + SEED_FILE + " to start again.");
      }

      function loadStoredState() {
        try {
          var raw = localStorage.getItem(STATE_KEY);
          if (!raw) {
            return null;
          }
          var parsed = JSON.parse(raw);
          var data = parsed && parsed.data && Array.isArray(parsed.data.recipes) ? parsed.data : parsed;
          if (!data || !Array.isArray(data.recipes)) {
            return null;
          }
          return ensureCatalogue(data);
        } catch (error) {
          console.warn("Could not load stored Cooking Journal state.", error);
          return null;
        }
      }

      function saveState(message) {
        if (!state.data) {
          return;
        }
        try {
          state.data.recipe_count = recipes().length;
          localStorage.setItem(STATE_KEY, JSON.stringify({
            version: 1,
            saved_at: new Date().toISOString(),
            data: state.data
          }));
          if (message) {
            showToast(message);
          }
        } catch (error) {
          showToast("Could not save changes in this browser.");
        }
      }

      // Normalize only the fields the app needs to operate safely. Existing
      // recipe fields are otherwise left intact for round-trip export.
      function ensureCatalogue(data) {
        if (!data || !Array.isArray(data.recipes)) {
          throw new Error("Recipe data must contain a recipes array.");
        }
        data.recipes = data.recipes.map(function (recipe, index) {
          var next = recipe && typeof recipe === "object" ? recipe : {};
          if (!next.id) {
            next.id = "local_recipe_" + (index + 1) + "_" + stableHash(next.title || String(index)).toString(36);
          }
          next.user_fields = Object.assign({}, DEFAULT_USER_FIELDS, next.user_fields || {});
          next.user_fields.rating = clampRating(next.user_fields.rating || next.user_fields.personal_rating || 0);
          next.user_fields.added_to_list = Boolean(next.user_fields.added_to_list);
          return next;
        });
        data.recipe_count = data.recipes.length;
        return data;
      }

      function recipes() {
        return state.data && Array.isArray(state.data.recipes) ? state.data.recipes : [];
      }

      function getRecipeById(id) {
        return recipes().find(function (recipe) {
          return String(recipe.id) === String(id);
        });
      }

      function isInMyList(recipe) {
        return Boolean(recipe && recipe.user_fields && recipe.user_fields.added_to_list);
      }

      function toggleMyList(recipeId) {
        var recipe = getRecipeById(recipeId);
        if (!recipe) {
          return;
        }
        recipe.user_fields = Object.assign({}, DEFAULT_USER_FIELDS, recipe.user_fields || {});
        recipe.user_fields.added_to_list = !recipe.user_fields.added_to_list;
        saveState(recipe.user_fields.added_to_list ? "Added to My List." : "Removed from My List.");
        renderPanel(currentPanel, false);
      }

      function setRatingFromClick(el, event) {
        var rect = el.getBoundingClientRect();
        var starIndex = Number(el.dataset.starIndex);
        var half = event.clientX - rect.left < rect.width / 2 ? 0.5 : 1;
        var rating = (starIndex - 1) + half;
        updateRecipeRating(el.dataset.recipeId, rating);
      }

      function updateRecipeRating(recipeId, rating) {
        var recipe = getRecipeById(recipeId);
        if (!recipe) {
          return;
        }
        recipe.user_fields = Object.assign({}, DEFAULT_USER_FIELDS, recipe.user_fields || {});
        recipe.user_fields.rating = clampRating(rating);
        recipe.user_fields.personal_rating = recipe.user_fields.rating;
        saveState("Rating saved.");
        renderPanel(currentPanel, false);
      }

      function getRating(recipe) {
        return clampRating(recipe && recipe.user_fields ? recipe.user_fields.rating || recipe.user_fields.personal_rating || 0 : 0);
      }

      // Categories start with useful named rows, then expand from the data's
      // meal types, tags, scales, and true searchable_values.
      function buildCategories() {
        var result = [];
        var seen = new Set();

        function addKnown(id, name, test) {
          var items = recipes().filter(test);
          if (!items.length) {
            return;
          }
          result.push({ id: id, name: name, items: items });
          seen.add(normalizeCategoryName(name));
        }

        addKnown("my-list", "My List", isInMyList);
        addKnown("dinner", "Dinner", function (recipe) { return fieldHas(recipe.meal_type, "dinner"); });
        addKnown("lunch", "Lunch", function (recipe) { return fieldHas(recipe.meal_type, "lunch"); });
        addKnown("breakfast", "Breakfast", function (recipe) { return fieldHas(recipe.meal_type, "breakfast"); });
        addKnown("dessert", "Dessert", function (recipe) { return fieldHas(recipe.meal_type, "dessert") || fieldHas(recipe.tags, "dessert") || searchableTruthy(recipe, "dessert"); });
		addKnown("gluten-free", "Gluten Free", function (recipe) {  return fieldHas(recipe.tags, "gluten free") ||searchableTruthy(recipe, "gluten_free") ||searchableTruthy(recipe, "diet_gluten_free"); });
		//addKnown("snack", "Snack", function (recipe) { return fieldHas(recipe.meal_type, "snack") || fieldHas(recipe.tags, "snack"); });
        addKnown("budget", "Budget", function (recipe) { return stringEquals(recipe.budget, "budget") || stringEquals(searchableValue(recipe, "budget_scale"), "budget"); });
        addKnown("easy", "Easy", function (recipe) { return stringEquals(recipe.difficulty, "easy") || stringEquals(searchableValue(recipe, "difficulty_scale"), "easy"); });
        //addKnown("quick", "Quick", function (recipe) { return stringEquals(recipe.speed, "quick") || fieldHas(recipe.tags, "quick") || stringEquals(searchableValue(recipe, "speed_scale"), "quick"); });
        addKnown("healthy", "Healthy", function (recipe) { return fieldHas(recipe.tags, "healthy") || searchableTruthy(recipe, "healthy"); });
        addKnown("vegetarian", "Vegetarian", function (recipe) { return fieldHas(recipe.tags, "vegetarian") || searchableTruthy(recipe, "vegetarian"); });
        addKnown("vegan", "Vegan", function (recipe) { return searchableTruthy(recipe, "vegan") || fieldHas(recipe.tags, "vegan"); });
        addKnown("smoothies", "Smoothies", function (recipe) { return fieldHas(recipe.meal_type, "smoothie") || fieldHas(recipe.tags, "smoothie"); });
        addKnown("baking", "Baking", function (recipe) { return fieldHas(recipe.tags, "baking") || searchableTruthy(recipe, "baking") || fieldHas(recipe.meal_type, "baking"); });
        addKnown("air-fryer", "Air Fryer", function (recipe) { return searchableTruthy(recipe, "air_fryer_candidate") || Boolean(recipe.air_fryer && recipe.air_fryer.applicable); });
        addKnown("freezer-friendly", "Freezer Friendly", function (recipe) { return searchableTruthy(recipe, "freezer_friendly"); });
        addKnown("make-ahead", "Make Ahead", function (recipe) { return searchableTruthy(recipe, "make_ahead") || fieldHas(recipe.tags, "make-ahead") || fieldHas(recipe.tags, "make ahead"); });
        //addKnown("pasta", "Pasta", function (recipe) { return recipeHasWord(recipe, "pasta"); });
        //addKnown("chicken", "Chicken", function (recipe) { return recipeHasWord(recipe, "chicken"); });
        //addKnown("rice", "Rice", function (recipe) { return recipeHasWord(recipe, "rice"); });
        //addKnown("noodles", "Noodles", function (recipe) { return recipeHasWord(recipe, "noodle") || recipeHasWord(recipe, "noodles"); });
        //addKnown("curry", "Curry", function (recipe) { return recipeHasWord(recipe, "curry"); });

        var dynamicMap = new Map();
        recipes().forEach(function (recipe) {
          addDynamicValues(dynamicMap, recipe, recipe.meal_type, "meal");
          addDynamicValues(dynamicMap, recipe, recipe.tags, "tag");
          addDynamicValue(dynamicMap, recipe, recipe.difficulty, "difficulty");
          addDynamicValue(dynamicMap, recipe, recipe.speed, "speed");
          addDynamicValue(dynamicMap, recipe, recipe.budget, "budget");
          var searchable = recipe.searchable_values || {};
          Object.keys(searchable).forEach(function (key) {
            var value = searchable[key];
            if (value === true) {
              addDynamicValue(dynamicMap, recipe, key, "searchable");
            } else if (typeof value === "string" && key.indexOf("_scale") !== -1) {
              addDynamicValue(dynamicMap, recipe, value, "searchable");
            }
          });
        });

        Array.from(dynamicMap.values())
          .filter(function (category) {
            return category.items.length >= 2 && !seen.has(normalizeCategoryName(category.name));
          })
          .sort(function (a, b) {
            return b.items.length - a.items.length || a.name.localeCompare(b.name);
          })
          .forEach(function (category) {
            seen.add(normalizeCategoryName(category.name));
            result.push(category);
          });

        return result;
      }

      function addDynamicValues(map, recipe, values, source) {
        asArray(values).forEach(function (value) {
          addDynamicValue(map, recipe, value, source);
        });
      }

      function addDynamicValue(map, recipe, value, source) {
        if (!hasContent(value)) {
          return;
        }
        var name = friendlyName(value);
        if (!name || name.length < 3) {
          return;
        }
        var id = source + ":" + slugify(name);
        if (!map.has(id)) {
          map.set(id, { id: id, name: name, items: [] });
        }
        var entry = map.get(id);
        if (!entry.items.some(function (item) { return item.id === recipe.id; })) {
          entry.items.push(recipe);
        }
      }

      function getCategoryById(id) {
        return buildCategories().find(function (category) {
          return category.id === id;
        });
      }

      function resetKitchenSession() {
        kitchen.selected = [];
        kitchen.draft = "";
        kitchen.strict = false;
        kitchen.pantryAssumed = true;
        clearTimeout(kitchenSuggestionTimer);
      }

      function resetKitchenIndex() {
        kitchenIndex = {
          version: kitchenIndex.version + 1,
          recipes: [],
          suggestions: [],
          resultsCache: new Map()
        };
      }

      function rebuildKitchenIndex() {
        var suggestionMap = new Map();
        var indexedRecipes = recipes().map(function (recipe) {
          return buildKitchenRecipeIndex(recipe, suggestionMap);
        });
        kitchenIndex = {
          version: kitchenIndex.version + 1,
          recipes: indexedRecipes,
          suggestions: buildKitchenSuggestionList(suggestionMap),
          resultsCache: new Map()
        };
      }

      function buildKitchenRecipeIndex(recipe, suggestionMap) {
        var source = getRecipeIngredientSource(recipe);
        var seen = new Set();
        var ingredientSet = new Set();
        var nonPantryIngredientSet = new Set();
        var pantryIngredientSet = new Set();
        var ingredients = [];
        var nonPantryIngredients = [];
        var pantryIngredients = [];
        var displayKeywords = [];

        source.forEach(function (item) {
          var term = makeIngredientTerm(item);
          if (!term || seen.has(term.key)) {
            return;
          }
          seen.add(term.key);
          ingredientSet.add(term.key);
          ingredients.push(term);
          displayKeywords.push(term.label);
          addSuggestionTerm(suggestionMap, term);
          if (term.pantry) {
            pantryIngredientSet.add(term.key);
            pantryIngredients.push(term);
          } else {
            nonPantryIngredientSet.add(term.key);
            nonPantryIngredients.push(term);
          }
        });

        return {
          recipeId: String(recipe.id || ""),
          recipe: recipe,
          title: displayValue(recipe.title, "Untitled recipe"),
          normalizedTitle: normalizeSearch(recipe.title),
          ingredientSet: ingredientSet,
          nonPantryIngredientSet: nonPantryIngredientSet,
          pantryIngredientSet: pantryIngredientSet,
          ingredients: ingredients,
          nonPantryIngredients: nonPantryIngredients,
          pantryIngredients: pantryIngredients,
          displayKeywords: displayKeywords,
          searchText: normalizeIngredient(displayKeywords.join(" ") + " " + flattenText(recipe.ingredients)),
          specialtyIngredientSet: buildSpecialtyIngredientSet(recipe)
        };
      }

      function getRecipeIngredientSource(recipe) {
        var source = asArray(recipe.ingredient_keywords);
        return source.length ? source : extractIngredientKeywords(recipe.ingredients);
      }

      function extractIngredientKeywords(ingredients) {
        var result = [];
        asArray(ingredients).forEach(function (line) {
          String(line).split(/[,;()]+|\/|\bor\b|\band\b/i).forEach(function (part) {
            var cleaned = cleanIngredientPhrase(part);
            if (cleaned) {
              result.push(cleaned);
            }
          });
        });
        return result;
      }

      function cleanIngredientPhrase(value) {
        return normalizeIngredient(value)
          .replace(/\b\d+\b/g, " ")
          .replace(/\b(cups?|tbsp|tablespoons?|tsp|teaspoons?|grams?|g|kg|ml|litres?|l|ounces?|oz|pounds?|lb|lbs|pinch|handful|large|small|medium|fresh|dried|finely|roughly|chopped|diced|sliced|minced|peeled|grated|optional|to taste|about|approx|cooked|uncooked|raw)\b/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function makeIngredientTerm(value) {
        var label = normalizeIngredient(value);
        if (!label) {
          return null;
        }
        var key = canonicalIngredient(label);
        if (!key) {
          return null;
        }
        return {
          key: key,
          label: label,
          pantry: isPantryStapleKey(key) || isPantryStaple(label)
        };
      }

      function buildSpecialtyIngredientSet(recipe) {
        var keys = new Set();
        asArray(recipe.specialty_or_less_common_ingredients).forEach(function (item) {
          var term = makeIngredientTerm(item);
          if (term) {
            keys.add(term.key);
          }
        });
        return keys;
      }

      function addSuggestionTerm(map, term) {
        if (!term || !term.key || !term.label) {
          return;
        }
        if (!map.has(term.key)) {
          map.set(term.key, {
            key: term.key,
            label: term.label,
            labels: [],
            labelSet: new Set()
          });
        }
        var entry = map.get(term.key);
        if (!entry.labelSet.has(term.label)) {
          entry.labelSet.add(term.label);
          entry.labels.push(term.label);
        }
        if (preferIngredientLabel(term.label, entry.label)) {
          entry.label = term.label;
        }
      }

      function buildKitchenSuggestionList(map) {
        SYNONYM_GROUPS.forEach(function (group) {
          var base = makeIngredientTerm(group[0]);
          if (!base) {
            return;
          }
          group.forEach(function (alias) {
            addSuggestionTerm(map, {
              key: base.key,
              label: normalizeIngredient(alias),
              pantry: isPantryStaple(alias)
            });
          });
        });
        PANTRY_STAPLES.forEach(function (item) {
          var term = makeIngredientTerm(item);
          addSuggestionTerm(map, term);
        });
        return Array.from(map.values()).map(function (entry) {
          var searchParts = entry.labels.slice();
          searchParts.push(entry.key);
          delete entry.labelSet;
          entry.searchText = normalizeIngredient(searchParts.join(" "));
          return entry;
        }).sort(function (a, b) {
          return a.label.localeCompare(b.label);
        });
      }

      function preferIngredientLabel(candidate, current) {
        if (!current) {
          return true;
        }
        var candidateWords = candidate.split(" ").length;
        var currentWords = current.split(" ").length;
        if (candidateWords !== currentWords) {
          return candidateWords < currentWords;
        }
        return candidate.length < current.length;
      }

      function getIngredientSuggestions() {
        return kitchenIndex.suggestions;
      }

      function scoreIngredientSuggestion(item, query, canonicalQuery) {
        if (!query) {
          return 0;
        }
        if (item.key === canonicalQuery) {
          return 100;
        }
        if (item.labels.some(function (label) { return label === query; })) {
          return 96;
        }
        if (item.labels.some(function (label) { return label.indexOf(query) === 0; })) {
          return 82;
        }
        if (item.label.indexOf(query) !== -1) {
          return 70;
        }
        if (item.searchText.indexOf(query) !== -1) {
          return 56;
        }
        if (item.key.indexOf(canonicalQuery) !== -1) {
          return 42;
        }
        return 0;
      }

      function getKitchenResults() {
        var selected = kitchen.selected.map(normalizeKitchenSelection).filter(function (item) {
          return item.key;
        });
        kitchen.selected = selected;
        var selectedKeys = selected.map(function (item) { return item.key; }).sort();
        var cacheKey = [
          kitchenIndex.version,
          kitchen.strict ? "strict" : "ranked",
          kitchen.pantryAssumed ? "pantry-on" : "pantry-off",
          selectedKeys.join(",")
        ].join("|");
        if (kitchenIndex.resultsCache.has(cacheKey)) {
          return kitchenIndex.resultsCache.get(cacheKey);
        }

        var selectedKeySet = new Set(selectedKeys);
        var results = kitchenIndex.recipes.map(function (entry) {
          return scoreKitchenIndexedRecipe(entry, selected, selectedKeySet);
        }).filter(function (item) {
          return kitchen.strict ? item.strictPass : item.matchedIngredients.length > 0;
        }).sort(function (a, b) {
          return b.score - a.score || b.matchPercent - a.matchPercent || a.missingNonPantryCount - b.missingNonPantryCount || a.title.localeCompare(b.title);
        });
        kitchenIndex.resultsCache.set(cacheKey, results);
        return results;
      }

      function scoreKitchenIndexedRecipe(entry, selected, selectedKeySet) {
        var matchedIngredients = selected.filter(function (item) {
          return entry.ingredientSet.has(item.key);
        });
        var matchedNonPantry = entry.nonPantryIngredients.filter(function (term) {
          return selectedKeySet.has(term.key);
        });
        var matchedPantry = entry.pantryIngredients.filter(function (term) {
          return selectedKeySet.has(term.key);
        });
        var missingIngredients = entry.nonPantryIngredients.filter(function (term) {
          return !selectedKeySet.has(term.key);
        });
        var missingPantryIngredients = kitchen.pantryAssumed ? [] : entry.pantryIngredients.filter(function (term) {
          return !selectedKeySet.has(term.key);
        });
        var assumedPantry = kitchen.pantryAssumed ? entry.pantryIngredients.filter(function (term) {
          return !selectedKeySet.has(term.key);
        }) : [];
        var pantryMatchedOrAssumed = uniqueTerms(matchedPantry.concat(assumedPantry));
        var missingSpecialty = missingIngredients.filter(function (term) {
          return entry.specialtyIngredientSet.has(term.key);
        });
        var matchedCoreCount = countMatchedCoreIngredients(matchedIngredients);
        var strictPass = selected.every(function (item) {
          return entry.ingredientSet.has(item.key);
        });
        var matchPercent = entry.nonPantryIngredients.length ? matchedNonPantry.length / entry.nonPantryIngredients.length : (matchedIngredients.length ? 1 : 0);
        var readyBonus = missingIngredients.length === 0 && (kitchen.pantryAssumed || missingPantryIngredients.length === 0) ? 28 : 0;
        var score =
          matchedNonPantry.length * 28 +
          matchedPantry.length * 6 +
          assumedPantry.length * 1.5 +
          matchPercent * 75 +
          matchedCoreCount * 12 +
          readyBonus +
          (strictPass ? 12 : 0) -
          missingIngredients.length * 9 -
          missingSpecialty.length * 8 -
          missingPantryIngredients.length * 2;

        return {
          recipe: entry.recipe,
          title: entry.title,
          matchedIngredients: matchedIngredients,
          missingIngredients: missingIngredients,
          missingPantryIngredients: missingPantryIngredients,
          pantryMatchedOrAssumed: pantryMatchedOrAssumed,
          matchPercent: matchPercent,
          missingCount: missingIngredients.length,
          missingNonPantryCount: missingIngredients.length,
          missingPantryCount: missingPantryIngredients.length,
          strictPass: strictPass,
          score: score
        };
      }

      function uniqueTerms(items) {
        var seen = new Set();
        return items.filter(function (item) {
          if (seen.has(item.key)) {
            return false;
          }
          seen.add(item.key);
          return true;
        });
      }

      function countMatchedCoreIngredients(items) {
        var seen = new Set();
        items.forEach(function (item) {
          if (isCoreIngredientKey(item.key)) {
            seen.add(item.key);
          }
        });
        return seen.size;
      }

      function isCoreIngredientKey(key) {
        if (!coreIngredientKeyCache) {
          coreIngredientKeyCache = new Set(CORE_INGREDIENTS.map(canonicalIngredient));
        }
        return coreIngredientKeyCache.has(canonicalIngredient(key));
      }

      function normalizeKitchenSelection(value) {
        var label = value && typeof value === "object" ? value.label : value;
        var key = value && typeof value === "object" && value.key ? canonicalIngredient(value.key) : canonicalIngredient(label);
        label = normalizeIngredient(label) || lookupIngredientLabel(key) || key;
        return { key: key, label: label };
      }

      function lookupIngredientLabel(key) {
        var match = getIngredientSuggestions().find(function (item) {
          return item.key === key;
        });
        return match ? match.label : "";
      }

      function getSelectedIngredientKeys() {
        var keys = new Set();
        kitchen.selected.forEach(function (item) {
          var entry = normalizeKitchenSelection(item);
          if (entry.key) {
            keys.add(entry.key);
          }
        });
        return keys;
      }

      function addKitchenIngredient(value) {
        var entry = normalizeKitchenSelection(value);
        if (!entry.key) {
          return;
        }
        if (!kitchen.selected.some(function (item) { return normalizeKitchenSelection(item).key === entry.key; })) {
          kitchen.selected.push(entry);
        }
        kitchen.draft = "";
        var input = document.getElementById("kitchenInput");
        if (input) {
          input.value = "";
        }
        renderSelectedKitchenIngredientsArea();
        renderKitchenSuggestions();
        renderKitchenResultsArea();
        if (input) {
          input.focus();
        }
      }

      function removeKitchenIngredient(value) {
        var key = canonicalIngredient(value);
        kitchen.selected = kitchen.selected.filter(function (item) {
          return normalizeKitchenSelection(item).key !== key;
        });
        renderSelectedKitchenIngredientsArea();
        renderKitchenSuggestions();
        renderKitchenResultsArea();
      }

      function recipeSearchBlob(recipe) {
        var searchable = recipe.searchable_values || {};
        var parts = [
          recipe.title,
          recipe.meal_type,
          recipe.tags,
          recipe.cuisine,
          recipe.difficulty,
          recipe.speed,
          recipe.budget,
          recipe.commonness,
          recipe.ingredients,
          recipe.ingredient_keywords
        ];
        Object.keys(searchable).forEach(function (key) {
          parts.push(key);
          parts.push(searchable[key]);
        });
        return normalizeSearch(flattenText(parts));
      }

      function recipeHasWord(recipe, word) {
        var blob = recipeSearchBlob(recipe);
        return blob.indexOf(normalizeSearch(word)) !== -1;
      }

      function fieldHas(value, needle) {
        var target = normalizeSearch(needle);
        return asArray(value).some(function (item) {
          return normalizeSearch(item).indexOf(target) !== -1;
        });
      }

      function stringEquals(value, expected) {
        return normalizeSearch(value) === normalizeSearch(expected);
      }

      function searchableValue(recipe, key) {
        return recipe.searchable_values ? recipe.searchable_values[key] : undefined;
      }

      function searchableTruthy(recipe, key) {
        return recipe.searchable_values && recipe.searchable_values[key] === true;
      }

      function getPrimaryCookingInfo(recipe) {
        var candidate = preferAirFryer ?
          (getBestCookingCandidate(recipe, "air-fryer") || getBestCookingCandidate(recipe, "oven")) :
          (getBestCookingCandidate(recipe, "air-fryer", { sourceOnly: true }) || getBestCookingCandidate(recipe, "oven"));
        if (candidate) {
          return cookingInfoFromCandidate(candidate);
        }
        var fallback = formatRecipeTime(recipe);
        return {
          device: null,
          temperature: null,
          time: fallback === "Time unknown" ? null : fallback,
          label: fallback === "Time unknown" ? fallback : "Total \u00b7 " + fallback
        };
      }

      function getBestCookingCandidate(recipe, deviceKey, options) {
        var candidates = getCookingCandidates(recipe, deviceKey, options);
        if (!candidates.length) {
          return null;
        }
        candidates.sort(function (a, b) {
          return (b.sortMinutes - a.sortMinutes) || (a.order - b.order);
        });
        return candidates[0];
      }

      function getCookingCandidates(recipe, deviceKey, options) {
        var steps = Array.isArray(recipe.method_steps) ? recipe.method_steps : [];
        return steps.map(function (step, index) {
          if (deviceKey === "air-fryer") {
            return makeAirFryerCandidate(recipe, step, index, options);
          }
          if (deviceKey === "oven") {
            return makeOvenCandidate(recipe, step, index);
          }
          return null;
        }).filter(Boolean);
      }

      function makeAirFryerCandidate(recipe, step, index, options) {
        var airFryer = step && typeof step.air_fryer === "object" ? step.air_fryer : null;
        if (options && options.sourceOnly && !isSourceAirFryerStep(step, airFryer)) {
          return null;
        }
        var heat = normalizeSearch(step ? step.heat_level : "");
        var hasAirFryer = heat.indexOf("air fryer") !== -1 || hasUsefulAirFryerStepInfo(airFryer);
        if (!hasAirFryer) {
          return null;
        }
        var timeInfo = getAirFryerTimeInfo(step, airFryer);
        if (isPreheatOnlyStep(step) && !timeInfo.label) {
          return null;
        }
        if (!timeInfo.label) {
          timeInfo = recipeCookTimeInfo(recipe);
        }
        var temperature = firstFiniteNumber(airFryer && airFryer.recommended_temperature_c, step && step.temperature_c);
        if (temperature == null && !timeInfo.label) {
          return null;
        }
        return {
          device: "Air Fryer",
          temperature: temperature,
          time: timeInfo.label,
          sortMinutes: timeInfo.sortMinutes,
          order: index
        };
      }

      function isSourceAirFryerStep(step, airFryer) {
        if (airFryer && airFryer.source_air_fryer_provided === true) {
          return true;
        }
        var text = normalizeSearch([step && step.heat_level, step && step.instruction]);
        return text.indexOf("air fryer") !== -1 && step && step.source_timing_provided === true;
      }

      function makeOvenCandidate(recipe, step, index) {
        var text = normalizeSearch([step && step.heat_level, step && step.instruction]);
        var isOven = text.indexOf("oven") !== -1 || /\b(bake|baked|baking|roast|roasted|roasting|grill|grilled|grilling)\b/.test(text);
        if (!isOven) {
          return null;
        }
        var timeInfo = getStepTimeInfo(step);
        if (isPreheatOnlyStep(step) && !timeInfo.label) {
          return null;
        }
        if (!timeInfo.label) {
          timeInfo = recipeCookTimeInfo(recipe);
        }
        var temperature = firstFiniteNumber(step && step.temperature_c);
        if (temperature == null && !timeInfo.label) {
          return null;
        }
        return {
          device: "Oven",
          temperature: temperature,
          time: timeInfo.label,
          sortMinutes: timeInfo.sortMinutes,
          order: index
        };
      }

      function hasUsefulAirFryerStepInfo(airFryer) {
        if (!airFryer || typeof airFryer !== "object") {
          return false;
        }
        return firstFiniteNumber(airFryer.recommended_temperature_c) != null ||
          getMinuteRange(airFryer.estimated_time_range_minutes).length > 0 ||
          firstPositiveNumber(airFryer.start_check_minutes) != null ||
          airFryer.source_air_fryer_provided === true;
      }

      function getAirFryerTimeInfo(step, airFryer) {
        var range = getMinuteRange(airFryer && airFryer.estimated_time_range_minutes);
        if (range.length) {
          return {
            label: formatMinuteRange(range),
            sortMinutes: range[range.length - 1]
          };
        }
        var startCheck = firstPositiveNumber(airFryer && airFryer.start_check_minutes);
        if (startCheck != null) {
          return {
            label: formatMinutes(startCheck),
            sortMinutes: startCheck
          };
        }
        return getStepTimeInfo(step);
      }

      function getStepTimeInfo(step) {
        var minutes = firstPositiveNumber(step && step.time_minutes);
        return minutes == null ? { label: null, sortMinutes: 0 } : {
          label: formatMinutes(minutes),
          sortMinutes: minutes
        };
      }

      function recipeCookTimeInfo(recipe) {
        var minutes = firstPositiveNumber(recipe && recipe.cook_time_minutes);
        if (minutes == null) {
          minutes = firstPositiveNumber(recipe && recipe.total_time_minutes);
        }
        if (minutes == null) {
          return { label: null, sortMinutes: 0 };
        }
        return {
          label: formatMinutes(minutes),
          sortMinutes: minutes
        };
      }

      function cookingInfoFromCandidate(candidate) {
        var temperature = formatTemperature(candidate.temperature);
        var parts = [candidate.device, temperature, candidate.time].filter(Boolean);
        return {
          device: candidate.device || null,
          temperature: temperature,
          time: candidate.time || null,
          label: parts.length ? parts.join(" \u00b7 ") : "Time unknown"
        };
      }

      function formatTemperature(value) {
        var number = firstFiniteNumber(value);
        if (number == null) {
          return null;
        }
        return formatCompactNumber(number) + "\u00b0C";
      }

      function formatMinuteRange(range) {
        if (!range.length) {
          return null;
        }
        if (range.length === 1 || range[0] === range[range.length - 1]) {
          return formatMinutes(range[0]);
        }
        return formatCompactNumber(range[0]) + "-" + formatCompactNumber(range[range.length - 1]) + " min";
      }

      function getMinuteRange(value) {
        if (!Array.isArray(value)) {
          return [];
        }
        return value.map(firstPositiveNumber).filter(function (number) {
          return number != null;
        }).sort(function (a, b) {
          return a - b;
        });
      }

      function firstFiniteNumber() {
        for (var i = 0; i < arguments.length; i += 1) {
          if (arguments[i] == null || String(arguments[i]).trim() === "") {
            continue;
          }
          var number = Number(arguments[i]);
          if (Number.isFinite(number)) {
            return number;
          }
        }
        return null;
      }

      function firstPositiveNumber() {
        for (var i = 0; i < arguments.length; i += 1) {
          var number = Number(arguments[i]);
          if (Number.isFinite(number) && number > 0) {
            return number;
          }
        }
        return null;
      }

      function isPreheatOnlyStep(step) {
        if (!step) {
          return false;
        }
        return /\bpreheat\b/.test(normalizeSearch(step.instruction)) && firstPositiveNumber(step.time_minutes) == null;
      }

      function formatCompactNumber(value) {
        var number = Number(value);
        if (!Number.isFinite(number)) {
          return "";
        }
        return Number.isInteger(number) ? String(number) : String(Math.round(number * 10) / 10);
      }

      function getRecipeImagePath(recipe) {
        return typeof (recipe && recipe.image_path) === "string" ? recipe.image_path.trim() : "";
      }

      function getIngredientLabels(recipe) {
        return asArray(recipe && recipe.ingredients);
      }

      function formatRecipeTime(recipe) {
        var minutes = getRecipeMinutes(recipe);
        return minutes ? formatMinutes(minutes) : "Time unknown";
      }

      // Time estimation follows the requested precedence and treats overnight
      // instructions as 12 hours only when no exact time is available.
      function getRecipeMinutes(recipe) {
        var total = toNumber(recipe.total_time_minutes);
        if (total > 0) {
          return total;
        }
        var prep = toNumber(recipe.prep_time_minutes);
        var cook = toNumber(recipe.cook_time_minutes);
        var inactive = toNumber(recipe.inactive_time_minutes);
        if (prep > 0 || cook > 0 || inactive > 0) {
          return prep + cook + inactive;
        }
        var steps = Array.isArray(recipe.method_steps) ? recipe.method_steps : [];
        var stepTotal = steps.reduce(function (sum, step) {
          return sum + Math.max(0, toNumber(step.time_minutes));
        }, 0);
        if (stepTotal > 0) {
          return stepTotal;
        }
        var hasOvernight = steps.some(function (step) {
          return /overnight/i.test([step.visual_or_texture_cue, step.instruction, step.beginner_tip].filter(Boolean).join(" "));
        });
        return hasOvernight ? 720 : null;
      }

      function formatMinutes(minutes) {
        minutes = Math.round(Number(minutes) || 0);
        if (minutes <= 0) {
          return "Time unknown";
        }
        if (minutes < 60) {
          return minutes + " min";
        }
        var hours = Math.floor(minutes / 60);
        var mins = minutes % 60;
        return hours + " hr" + (mins ? " " + mins + " min" : "");
      }

      function isPantryStaple(term) {
        var key = canonicalIngredient(term);
        return isPantryStapleKey(key);
      }

      function isPantryStapleKey(key) {
        key = canonicalIngredient(key);
        if (!key) {
          return false;
        }
        var pantry = getPantryStapleCache();
        if (pantry.keys.has(key)) {
          return true;
        }
        return pantry.terms.some(function (staple) {
          return containsWholePhrase(key, staple.key) || containsWholePhrase(staple.key, key);
        });
      }

      function getPantryStapleCache() {
        if (!pantryStapleCache) {
          var terms = PANTRY_STAPLES.map(function (item) {
            return { label: normalizeIngredient(item), key: canonicalIngredient(item) };
          });
          pantryStapleCache = {
            terms: terms,
            keys: new Set(terms.map(function (item) { return item.key; }))
          };
        }
        return pantryStapleCache;
      }

      function termsMatch(a, b) {
        var left = normalizeIngredient(a);
        var right = normalizeIngredient(b);
        if (!left || !right) {
          return false;
        }
        if (left === right || singularize(left) === singularize(right)) {
          return true;
        }
        var leftGroup = synonymGroupKey(left);
        var rightGroup = synonymGroupKey(right);
        if (leftGroup && rightGroup && leftGroup === rightGroup) {
          return true;
        }
        if (containsWholePhrase(left, right) || containsWholePhrase(right, left)) {
          return true;
        }
        return canonicalIngredient(left) === canonicalIngredient(right);
      }

      function synonymGroupKey(term) {
        var norm = normalizeIngredient(term);
        var aliases = getSynonymAliases();
        for (var i = 0; i < aliases.length; i += 1) {
          if (
            aliases[i].label === norm ||
            containsWholePhrase(norm, aliases[i].label) ||
            containsWholePhrase(aliases[i].label, norm)
          ) {
            return aliases[i].key;
          }
        }
        return "";
      }

      function canonicalIngredient(term) {
        var norm = normalizeIngredient(term);
        if (!norm) {
          return "";
        }
        if (canonicalIngredientCache.has(norm)) {
          return canonicalIngredientCache.get(norm);
        }
        var group = synonymGroupKey(norm);
        var canonical = group || singularize(norm);
        canonicalIngredientCache.set(norm, canonical);
        return canonical;
      }

      function getSynonymAliases() {
        if (!synonymAliasCache) {
          synonymAliasCache = [];
          SYNONYM_GROUPS.forEach(function (group) {
            var key = singularize(normalizeIngredient(group[0]));
            group.forEach(function (item) {
              var label = normalizeIngredient(item);
              if (label) {
                synonymAliasCache.push({ key: key, label: label });
              }
            });
          });
        }
        return synonymAliasCache;
      }

      function containsWholePhrase(haystack, needle) {
        haystack = normalizeIngredient(haystack);
        needle = normalizeIngredient(needle);
        if (!haystack || !needle) {
          return false;
        }
        var pattern = new RegExp("(^| )" + escapeRegExp(needle) + "( |$)");
        return pattern.test(haystack);
      }

      function normalizeIngredient(value) {
        return String(value == null ? "" : value)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, " and ")
          .replace(/[-_/]/g, " ")
          .replace(/[^a-z0-9 ]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function singularize(value) {
        value = normalizeIngredient(value);
        return value.split(" ").map(function (part) {
          if (part.length > 4 && part.endsWith("ies")) {
            return part.slice(0, -3) + "y";
          }
          if (part.length > 4 && part.endsWith("es")) {
            return part.slice(0, -2);
          }
          if (part.length > 3 && part.endsWith("s")) {
            return part.slice(0, -1);
          }
          return part;
        }).join(" ");
      }

      function normalizeSearch(value) {
        return flattenText(value)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[_-]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function flattenText(value) {
        if (value == null) {
          return "";
        }
        if (Array.isArray(value)) {
          return value.map(flattenText).join(" ");
        }
        if (typeof value === "object") {
          return Object.keys(value).map(function (key) {
            return key + " " + flattenText(value[key]);
          }).join(" ");
        }
        return String(value);
      }

      function asArray(value) {
        if (value == null || value === "") {
          return [];
        }
        if (Array.isArray(value)) {
          return value.filter(hasContent).map(function (item) {
            return displayValue(item, "");
          }).filter(Boolean);
        }
        return [displayValue(value, "")].filter(Boolean);
      }

      function linesToArray(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map(function (line) { return line.trim(); })
          .filter(Boolean);
      }

      function linesValue(value) {
        return asArray(value).join("\n");
      }

      function textValue(value) {
        if (value == null) {
          return "";
        }
        if (Array.isArray(value)) {
          return value.map(function (item) { return displayValue(item, ""); }).join("\n");
        }
        if (typeof value === "object") {
          return JSON.stringify(value, null, 2);
        }
        return String(value);
      }

      function cleanString(value) {
        var text = String(value == null ? "" : value).trim();
        return text || null;
      }

      function nullableNumber(value) {
        if (value == null || String(value).trim() === "") {
          return null;
        }
        var number = Number(value);
        return Number.isFinite(number) && number >= 0 ? number : null;
      }

      function toNumber(value) {
        var number = Number(value);
        return Number.isFinite(number) ? number : 0;
      }

      function hasContent(value) {
        if (value == null) {
          return false;
        }
        if (Array.isArray(value)) {
          return value.some(hasContent);
        }
        if (typeof value === "object") {
          return Object.keys(value).some(function (key) { return hasContent(value[key]); });
        }
        return String(value).trim() !== "";
      }

      function displayValue(value, fallback) {
        if (!hasContent(value)) {
          return fallback == null ? "" : fallback;
        }
        if (Array.isArray(value)) {
          return value.map(function (item) { return displayValue(item, ""); }).filter(Boolean).join(", ");
        }
        if (typeof value === "boolean") {
          return value ? "Yes" : "No";
        }
        if (typeof value === "object") {
          return flattenText(value);
        }
        return String(value);
      }

      function clampRating(value) {
        var number = Number(value) || 0;
        number = Math.round(number * 2) / 2;
        return Math.max(0, Math.min(5, number));
      }

      function stableRecipeColor(recipe) {
        var key = String(recipe.id || recipe.title || "recipe");
        var hue = stableHash(key) % 360;
        return "hsl(" + hue + " 28% 31%)";
      }

      function stableHash(value) {
        var hash = 0;
        var text = String(value || "");
        for (var i = 0; i < text.length; i += 1) {
          hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
      }

      function friendlyName(value) {
        return String(value || "")
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/\b\w/g, function (letter) { return letter.toUpperCase(); });
      }

      function formatKey(key) {
        return friendlyName(key);
      }

      function normalizeCategoryName(value) {
        return slugify(value);
      }

      function slugify(value) {
        return normalizeSearch(value).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char];
        });
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      function cssUrl(value) {
        return String(value == null ? "" : value)
          .replace(/\\/g, "/")
          .replace(/"/g, "%22")
          .replace(/\)/g, "%29");
      }

      function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function showToast(message) {
        var toast = document.getElementById("toast");
        if (!toast) {
          return;
        }
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("is-visible");
        }, 2600);
      }
    })();
  </script>
</body>
</html>
