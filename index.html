<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonny's Kitchen</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151312;
      --bg-soft: #1d1a18;
      --panel: #24201d;
      --panel-strong: #302a25;
      --line: rgba(255, 239, 218, 0.14);
      --text: #f4ece2;
      --muted: #bcae9f;
      --muted-2: #8f8174;
      --accent: #d99b57;
      --accent-strong: #efb36e;
      --accent-dim: rgba(217, 155, 87, 0.16);
      --green: #8ca974;
      --green-dim: rgba(140, 169, 116, 0.18);
      --danger: #d27368;
      --danger-dim: rgba(210, 115, 104, 0.16);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
      --radius: 8px;
      --star: #e6b95b;
      --star-empty: #60564f;
      --focus: 0 0 0 3px rgba(217, 155, 87, 0.35);
      --card-w: 222px;
      --card-gap: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
      /* The page itself never scrolls sideways: rows that are wider than the
         screen scroll (or drag) inside their own strip instead. `clip` rather
         than `hidden` so the sticky topbar keeps working. */
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 220px),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    a {
      color: var(--accent-strong);
    }

    .app-shell {
      min-height: 100vh;
    }

    :fullscreen {
      overflow-y: auto;
    }

    :-webkit-full-screen {
      overflow-y: auto;
    }

    html:fullscreen,
    body:fullscreen,
    #app:fullscreen {
      width: 100%;
      height: auto;
      min-height: 100vh;
      background: var(--bg);
      overflow-y: auto;
      overscroll-behavior-y: auto;
      touch-action: auto;
      -webkit-overflow-scrolling: touch;
    }

    html:-webkit-full-screen,
    body:-webkit-full-screen,
    #app:-webkit-full-screen {
      width: 100%;
      height: auto;
      min-height: 100vh;
      background: var(--bg);
      overflow-y: auto;
      overscroll-behavior-y: auto;
      touch-action: auto;
      -webkit-overflow-scrolling: touch;
    }

    #app:fullscreen .app-shell,
    #app:-webkit-full-screen .app-shell {
      height: auto;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 66px;
      padding: 12px clamp(16px, 4vw, 44px);
      background: rgba(21, 19, 18, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .icon-button,
    .round-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      color: var(--text);
      background: rgba(255, 239, 218, 0.09);
      border: 1px solid var(--line);
      transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .icon-button:hover,
    .round-button:hover {
      background: rgba(255, 239, 218, 0.15);
      border-color: rgba(255, 239, 218, 0.25);
      transform: translateY(-1px);
    }

    .burger-lines,
    .burger-lines::before,
    .burger-lines::after {
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 99px;
      content: "";
    }

    .burger-lines {
      position: relative;
    }

    .burger-lines::before {
      position: absolute;
      top: -6px;
      left: 0;
    }

    .burger-lines::after {
      position: absolute;
      top: 6px;
      left: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.05;
    }

    .brand strong {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
    }

    .brand span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .text-button,
    .primary-button,
    .danger-button,
    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 15px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 239, 218, 0.08);
      white-space: nowrap;
    }

    .primary-button {
      color: #1d1711;
      background: var(--accent);
      border-color: transparent;
      font-weight: 700;
    }

    .danger-button {
      color: #ffe9e5;
      background: var(--danger-dim);
      border-color: rgba(210, 115, 104, 0.35);
    }

    .ghost-button {
      background: transparent;
    }

    .text-button:hover,
    .primary-button:hover,
    .danger-button:hover,
    .ghost-button:hover {
      filter: brightness(1.08);
    }

    .topbar-actions .icon-button {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: var(--radius);
    }

    .button-icon {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .main-content {
      width: 100%;
      padding: 26px clamp(16px, 4vw, 44px) 56px;
    }

    .timer-visible .main-content {
      padding-bottom: 170px;
    }

    .home-header,
    .panel-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .home-title {
      margin-bottom: 8px;
      font-size: clamp(2.1rem, 6vw, 4.4rem);
      line-height: 0.95;
    }

    .subtitle,
    .muted {
      color: var(--muted);
    }

    .category-row {
      margin: 0 0 32px;
    }

    .view-more-row {
      display: flex;
      justify-content: center;
      margin: 0 0 32px;
    }

    .row-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .row-heading h2 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
    }

    /* Category titles double as links to the full category page. They keep the
       heading's own type and colour so they still read as titles, and only pick
       up an accent on hover/focus to show they are clickable. */
    .row-heading-link {
      display: block;
      padding: 0;
      color: inherit;
      background: none;
      font: inherit;
      letter-spacing: inherit;
      text-align: left;
      transition: color 140ms ease;
    }

    .row-heading-link:hover {
      color: var(--accent-strong);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .count-pill,
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 99px;
      color: var(--muted);
      background: rgba(255, 239, 218, 0.07);
      border: 1px solid var(--line);
      font-size: 0.82rem;
    }

    .recipe-row {
      display: flex;
      gap: var(--card-gap);
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 3px 4px 14px;
      scroll-snap-type: x proximity;
      scrollbar-color: rgba(255, 239, 218, 0.24) transparent;
    }

    .recipe-row::-webkit-scrollbar {
      height: 10px;
    }

    .recipe-row::-webkit-scrollbar-thumb {
      background: rgba(255, 239, 218, 0.22);
      border-radius: 99px;
    }

    /* On screens too narrow for the full row, the "View all" tile sits past the
       right edge and is simply clipped — the category heading links to the same
       page. Clipping only the x axis keeps the cards' hover lift and shadow. */
    .recipe-row.is-carousel-row {
      overflow: hidden;
      overflow-x: clip;
      overflow-y: visible;
      scroll-snap-type: none;
    }

    .recipe-viewport {
      overflow: hidden;
      flex: 0 0 auto;
      /* Five cards where there is room for them, otherwise whatever the screen
         allows — cards are never scaled down, the rest are a drag away. */
      width: min(calc(var(--card-w) * 5 + var(--card-gap) * 4), 100%);
      touch-action: pan-y;
      cursor: grab;
    }

    .recipe-row.is-carousel-row.is-dragging .recipe-viewport {
      cursor: grabbing;
    }

    .recipe-track {
      display: flex;
      gap: var(--card-gap);
      margin-left: calc((var(--card-w) + var(--card-gap)) * -5);
      will-change: transform;
    }

    .recipe-track.is-animating {
      transition: transform 180ms ease;
    }

    .recipe-row.is-carousel-row.is-dragging .recipe-track * {
      user-select: none;
    }

    .recipe-card,
    .view-all-card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: 138px;
      overflow: hidden;
      border-radius: var(--radius);
      color: var(--text);
      background-color: var(--panel-strong);
      background-position: center;
      background-size: cover;
      box-shadow: var(--shadow);
      scroll-snap-align: start;
      text-align: left;
      isolation: isolate;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      border: 1px solid rgba(255, 239, 218, 0.1);
    }

    .recipe-card::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.28)),
        linear-gradient(0deg, rgba(0, 0, 0, 0.8), transparent 70%);
      content: "";
    }

    .recipe-card:hover,
    .view-all-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
      border-color: rgba(217, 155, 87, 0.48);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      gap: 5px;
      padding: 14px;
    }

    .card-title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-weight: 700;
      line-height: 1.12;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
    }

    .card-time {
      color: var(--muted);
      font-size: 0.84rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .card-cook-badge {
      display: inline-block;
      max-width: 100%;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 99px;
      color: #fff6eb;
      background: rgba(0, 0, 0, 0.58);
      border: 1px solid rgba(255, 239, 218, 0.22);
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.15;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .stars {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      min-height: 18px;
      color: var(--star-empty);
      line-height: 1;
    }

    .star {
      position: relative;
      display: inline-block;
      width: 17px;
      height: 17px;
      color: var(--star-empty);
      font-size: 17px;
      line-height: 17px;
    }

    .star::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--fill, 0%);
      overflow: hidden;
      color: var(--star);
      content: "★";
    }

    .view-all-card {
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        linear-gradient(135deg, rgba(217, 155, 87, 0.2), rgba(140, 169, 116, 0.12)),
        var(--panel);
      text-align: center;
    }

    .view-all-card span {
      display: block;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .card-grid .recipe-card {
      width: 100%;
      min-width: 0;
      flex-basis: auto;
      aspect-ratio: 1.55 / 1;
      height: auto;
      min-height: 132px;
    }

    .side-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      background: rgba(0, 0, 0, 0);
      transition: background 180ms ease;
    }

    .side-menu {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(310px, 86vw);
      padding: 18px;
      background: #201c19;
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(-102%);
      transition: transform 180ms ease;
    }

    .side-backdrop.is-open {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.48);
    }

    .side-backdrop.is-open .side-menu {
      transform: translateX(0);
    }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .menu-head h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .menu-list {
      display: grid;
      gap: 9px;
    }

    .menu-list button {
      justify-content: flex-start;
      width: 100%;
      min-height: 44px;
      color: var(--text);
      background: rgba(255, 239, 218, 0.07);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-align: left;
    }

    .menu-list button:hover {
      background: rgba(255, 239, 218, 0.12);
    }
    .menu-separator {
     border: 0;
     border-top: 1px solid rgba(255, 255, 255, 0.15);
     margin: 10px 0;
}

    .detail-panel,
    .cook-card-panel,
    .category-panel,
    .search-panel,
    .kitchen-panel,
    .import-panel {
      max-width: 1240px;
      margin: 0 auto;
    }

    .back-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(260px, 420px) minmax(0, 1fr);
      gap: clamp(20px, 4vw, 42px);
      align-items: start;
      margin-bottom: 30px;
    }

    .detail-image-wrap,
    .detail-image-placeholder {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }

    .detail-image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-image-placeholder {
      display: grid;
      place-items: end start;
      min-height: 250px;
      padding: 18px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 700;
    }

    .cook-card {
      display: grid;
      grid-template-columns: minmax(240px, 360px) minmax(0, 1fr);
      gap: clamp(18px, 4vw, 32px);
      align-items: stretch;
      padding: clamp(14px, 3vw, 20px);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255, 239, 218, 0.08), rgba(0, 0, 0, 0.16)),
        var(--panel);
      border: 1px solid rgba(255, 239, 218, 0.14);
      box-shadow: var(--shadow);
    }

    .cook-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .cook-card-title-block {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 10px;
    }

    .cook-card .detail-image-wrap,
    .cook-card .detail-image-placeholder {
      height: 100%;
      min-height: 260px;
      aspect-ratio: auto;
      box-shadow: none;
    }

    .cook-card-body {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 14px;
    }

    .cook-card-body h1 {
      margin-bottom: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1;
    }

    .cook-card-label {
      display: inline-flex;
      align-self: flex-start;
      padding: 6px 10px;
      border-radius: 99px;
      color: #fff6eb;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 239, 218, 0.18);
      font-weight: 700;
    }

    .cook-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cook-chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 10px;
      border-radius: 99px;
      color: var(--text);
      background: rgba(255, 239, 218, 0.08);
      border: 1px solid var(--line);
      font-size: 0.9rem;
    }

    .cook-ingredients {
      display: grid;
      gap: 6px;
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.35;
    }

    .cook-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 4px;
    }

    .timer-button {
      color: var(--text);
      background: var(--accent-dim);
      border-color: rgba(217, 155, 87, 0.42);
    }

    .timer-button .button-icon {
      width: 22px;
      height: 22px;
    }

    .method-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .method-heading h2 {
      margin: 0;
    }

    .detail-section .method-heading h2 {
      margin: 0;
    }

    .title-line {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-line h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
    }

    .list-toggle {
      margin-top: 4px;
      color: var(--text);
      background: var(--accent-dim);
      border-color: rgba(217, 155, 87, 0.4);
      font-size: 1.8rem;
      line-height: 1;
    }

    .meta-grid,
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-grid {
      margin: 16px 0;
    }

    .rating-control {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .star-button {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 6px;
      color: var(--star-empty);
      background: transparent;
    }

    .star-button .star {
      width: 23px;
      height: 23px;
      font-size: 23px;
      line-height: 23px;
    }

    .detail-sections {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .detail-section {
      padding: 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 239, 218, 0.025);
    }

    .detail-section h2 {
      margin-bottom: 12px;
      font-size: 1.08rem;
    }

    .detail-section p:last-child,
    .detail-section ul:last-child,
    .detail-section ol:last-child {
      margin-bottom: 0;
    }

    .plain-list,
    .method-list {
      padding-left: 1.2rem;
    }

    .plain-list li,
    .method-list li {
      margin-bottom: 8px;
    }

    .method-step {
      padding: 0 0 14px 4px;
    }

    .method-step-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .method-step-head p {
      flex: 1 1 auto;
      margin-bottom: 0;
    }

    .step-timer-button {
      width: 30px;
      height: 30px;
      min-width: 30px;
      margin-top: -2px;
    }

    .step-timer-button .button-icon {
      width: 16px;
      height: 16px;
    }

    .step-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 9px 0;
    }

    .step-note {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .object-grid {
      display: grid;
      gap: 8px;
    }

    .object-row {
      display: grid;
      grid-template-columns: minmax(120px, 210px) minmax(0, 1fr);
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 239, 218, 0.08);
    }

    .object-row strong {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-bottom-actions,
    .edit-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .edit-form {
      display: grid;
      gap: 18px;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-field input,
    .form-field textarea,
    .form-field select,
    .search-input,
    .kitchen-input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(255, 239, 218, 0.07);
      padding: 10px 12px;
    }

    .form-field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .edit-step {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 239, 218, 0.035);
    }

    .edit-step-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .search-box {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-results,
    .kitchen-groups {
      display: grid;
      gap: 12px;
    }

    .text-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 54px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 239, 218, 0.055);
      text-align: left;
    }

    .text-result:hover {
      background: rgba(255, 239, 218, 0.1);
    }

    .kitchen-builder {
      display: grid;
      grid-template-columns: minmax(240px, 360px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .kitchen-input-wrap {
      position: relative;
    }

    .suggestions {
      position: absolute;
      inset: calc(100% + 6px) 0 auto 0;
      z-index: 8;
      display: grid;
      gap: 4px;
      max-height: 250px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #231f1c;
      box-shadow: var(--shadow);
    }

    .suggestions:empty {
      display: none;
    }

    .suggestions button {
      min-height: 36px;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .suggestions button:hover {
      background: rgba(255, 239, 218, 0.1);
    }

    .selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .ingredient-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 5px 10px;
      border-radius: 99px;
      color: var(--text);
      background: var(--green-dim);
      border: 1px solid rgba(140, 169, 116, 0.35);
    }

    .ingredient-chip button {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      color: var(--text);
      background: rgba(0, 0, 0, 0.2);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
    }

    .kitchen-options {
      display: grid;
      gap: 4px;
    }

    .kitchen-note {
      margin: 10px 0 2px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .kitchen-group {
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .kitchen-group h2 {
      margin-bottom: 12px;
      font-size: 1.05rem;
    }

    .kitchen-result {
      display: grid;
      grid-template-columns: 222px minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 239, 218, 0.08);
    }

    .kitchen-result .recipe-card {
      box-shadow: none;
    }

    .match-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 9px;
    }

    .match-pill {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 99px;
      color: var(--text);
      background: rgba(255, 239, 218, 0.075);
      border: 1px solid var(--line);
      font-size: 0.82rem;
    }

    .match-copy {
      margin: 5px 0;
      color: var(--muted);
      line-height: 1.35;
    }

    .empty-state,
    .import-panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 239, 218, 0.045);
    }

    .import-panel {
      max-width: 720px;
      margin-top: 7vh;
    }

    .import-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      max-width: min(380px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: #28231f;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .confirm-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid rgba(210, 115, 104, 0.35);
      border-radius: var(--radius);
      background: var(--danger-dim);
    }

    .timer-panel {
      position: fixed;
      right: clamp(12px, 4vw, 44px);
      bottom: 12px;
      left: clamp(12px, 4vw, 44px);
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 239, 218, 0.24);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(32, 28, 25, 0.96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .timer-panel.is-expired {
      border-color: #ffd65a;
      box-shadow:
        0 0 0 1px rgba(255, 214, 90, 0.55),
        0 0 30px rgba(255, 214, 90, 0.58),
        var(--shadow);
    }

    .timer-display-button {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 0;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .timer-time {
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 800;
      line-height: 0.95;
    }

    .timer-label {
      overflow: hidden;
      max-width: 100%;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer-control {
      min-width: 112px;
      min-height: 56px;
      font-weight: 800;
    }

    .timer-edit-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      width: 100%;
      align-items: center;
    }

    .timer-edit-input {
      width: 100%;
      min-height: 56px;
      padding: 0 14px;
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(255, 239, 218, 0.08);
      border: 1px solid var(--line);
      font-size: clamp(1.5rem, 6vw, 2.4rem);
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }

    /* Full-page loader. Lives in the initial markup so it paints before the
       script runs, and sits above every other layer (highest elsewhere is 70). */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      color: var(--text);
      transition: opacity 260ms ease;
    }

    .loading-overlay[hidden] {
      display: none;
    }

    .loading-overlay.is-dismissed {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 239, 218, 0.16);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: loading-spin 900ms linear infinite;
    }

    .loading-overlay.has-error .loading-spinner {
      display: none;
    }

    .loading-text {
      margin: 0;
      max-width: min(520px, calc(100vw - 48px));
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation: none;
      }

      .loading-overlay {
        transition: none;
      }
    }

    @media (max-width: 800px) {
      :root {
        --card-w: 178px;
      }

      .topbar-actions .text-button {
        display: none;
      }

      .main-content {
        padding-inline: 14px;
      }

      .home-header,
      .panel-header,
      .title-line {
        align-items: flex-start;
        flex-direction: column;
      }

      .detail-layout,
      .cook-card,
      .edit-grid,
      .kitchen-builder,
      .kitchen-result {
        grid-template-columns: 1fr;
      }

      .recipe-card,
      .view-all-card,
      .kitchen-result .recipe-card {
        height: 132px;
      }

      .kitchen-result .recipe-card {
        width: min(100%, 260px);
      }

      .cook-card .detail-image-wrap,
      .cook-card .detail-image-placeholder {
        min-height: 210px;
        aspect-ratio: 4 / 3;
      }

      .cook-card-head {
        align-items: flex-start;
      }

      .timer-panel {
        right: 10px;
        bottom: 10px;
        left: 10px;
        gap: 10px;
        padding: 10px;
      }

      .timer-control {
        min-width: 92px;
        min-height: 52px;
      }

      .timer-edit-form {
        grid-template-columns: 1fr;
      }

      .timer-edit-form .primary-button,
      .timer-edit-form .ghost-button {
        width: 100%;
      }

      .object-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p class="loading-text" id="loadingText">Loading recipes…</p>
  </div>
  <div id="app"></div>
  <input id="jsonFileInput" class="hidden" type="file" accept="application/json,.json">

  <script>
    (function () {
      "use strict";

      var STATE_KEY = "cookingJournalAppState_v1";
      var TIMER_KEY = "dreddsKitchenTimerState_v1";
      var COOKING_PREFERENCE_KEY = "dreddsKitchenPreferAirFryer_v1";
      var SEED_FILE = "recipe_seed.json";
      var EXPORT_PREFIX = "cooking_journal_export_";
      var DEFAULT_USER_FIELDS = {
        personal_rating: 0,
        cooked_count: 0,
        last_cooked: null,
        would_cook_again: null,
        my_notes: "",
        note_to_future_me: "",
        changes_to_try_next_time: [],
        photo_paths: [],
        is_favourite: false,
        is_reliable_work_night_meal: false,
        household_reaction: "",
        rating: 0,
        added_to_list: false
      };

      var PANTRY_STAPLES = [
        "salt", "pepper", "black pepper", "white pepper", "water", "oil",
        "neutral oil", "olive oil", "vegetable oil", "canola oil", "butter",
        "sugar", "brown sugar", "flour", "plain flour", "milk", "egg",
        "eggs", "garlic", "onion", "rice", "pasta", "soy sauce", "stock",
        "chicken stock", "vegetable stock"
      ];

      var SYNONYM_GROUPS = [
        ["capsicum", "bell pepper", "bell peppers", "sweet pepper", "sweet peppers"],
        ["coriander", "cilantro"],
        ["prawn", "prawns", "shrimp", "shrimps"],
        ["bi carb soda", "bi-carb soda", "bicarb soda", "baking soda", "bicarbonate of soda"],
        ["cornflour", "corn flour", "cornstarch", "corn starch"],
        ["spring onion", "spring onions", "green onion", "green onions", "scallion", "scallions"],
        ["yoghurt", "yogurt"],
        ["passata", "tomato puree", "tomato purée"],
        ["mince", "ground beef", "beef mince", "minced beef"],
        ["egg", "eggs"],
        ["tomato", "tomatoes"],
        ["chilli", "chili", "chillies", "chilies"]
      ];

      var CORE_INGREDIENTS = [
        "chicken", "beef", "lamb", "tuna", "prawns", "shrimp", "egg",
        "eggs", "pasta", "rice", "noodles", "chickpeas", "lentils",
        "banana", "oats", "yoghurt", "yogurt"
      ];

      var state = {
        data: null
      };
      var CAROUSEL_CLICK_THRESHOLD = 6;
      // The homepage carousel loops through a category's full recipe list, not
      // just the 5 initially shown, so the track carries a buffer of
      // CAROUSEL_MAX_SHIFT extra cards on either side of the 5 visible ones,
      // ready to slide into view without waiting on a re-render mid-drag.
      // These must be assigned before boot() below, which renders the home
      // panel synchronously when saved state already exists in localStorage.
      var CAROUSEL_VISIBLE = 5;
      var CAROUSEL_MAX_SHIFT = 5;
      // Home shows categories a page at a time behind a "View more" button.
      // Assigned here, above boot(), for the same reason as the constants
      // above: boot() renders home synchronously when localStorage has state.
      var HOME_CATEGORY_PAGE_SIZE = 9;
      var homeVisibleCategoryCount = HOME_CATEGORY_PAGE_SIZE;
      var cardCarousel = {
        active: false,
        settling: false,
        captured: false,
        pointerId: null,
        row: null,
        track: null,
        startX: 0,
        lastDx: 0,
        slotWidth: 0
      };
      var suppressNextCarouselClick = false;
      var currentPanel = { type: "home" };
      var navStack = [];
      var searchQuery = "";
      var kitchen = {
        selected: [],
        draft: "",
        strict: false,
        pantryAssumed: true
      };
      var kitchenIndex = {
        version: 0,
        recipes: [],
        suggestions: [],
        resultsCache: new Map()
      };
      var canonicalIngredientCache = new Map();
      var synonymAliasCache = null;
      var pantryStapleCache = null;
      var coreIngredientKeyCache = null;
      var kitchenSuggestionTimer = null;
      var toastTimer = null;
      var pendingResetConfirm = false;
      var preferAirFryer = loadCookingPreference();
      var timerState = createEmptyTimerState();
      var timerInterval = null;
      var timerEditing = false;
      var timerEditWasRunning = false;
      var timerAudioContext = null;
      var alarmInterval = null;
      var alarmTimeout = null;
      var alarmNodes = [];
      var wakeLock = null;

      var app = document.getElementById("app");
      var fileInput = document.getElementById("jsonFileInput");
      var loadingOverlay = document.getElementById("loadingOverlay");

      // Give the browser a chance to paint the loading overlay before startup
      // begins: parsing the catalogue and rendering the first panel are
      // synchronous and can block for a while on a large recipe list. The first
      // frame callback runs before the overlay's initial paint, the second
      // after it, so by then the loader is genuinely on screen.
      // The timer is a fallback, not a delay: browsers suspend animation frames
      // in background or occluded tabs, and the app must still start there.
      // Whichever fires first wins; startApp only ever runs once.
      var startScheduled = false;
      requestAnimationFrame(function () {
        requestAnimationFrame(scheduleStart);
      });
      setTimeout(scheduleStart, 250);

      function scheduleStart() {
        if (startScheduled) {
          return;
        }
        startScheduled = true;
        startApp();
      }

      async function startApp() {
        try {
          initShell();
          setupFullscreenButton();
          restoreTimerState();
          attachGlobalEvents();
          // boot() resolves only once the first panel exists: the home rows
          // with their categories and recipe cards, or the import panel when
          // there is no saved state and the seed file cannot be fetched.
          await boot();
          // Let that markup paint before fading, so the overlay never reveals
          // a blank page. One frame, not a timed delay.
          requestAnimationFrame(dismissLoadingOverlay);
        } catch (error) {
          console.error("Jonny's Kitchen could not finish loading.", error);
          showLoadingOverlayError();
        }
      }

      function dismissLoadingOverlay() {
        if (!loadingOverlay || loadingOverlay.hidden) {
          return;
        }
        loadingOverlay.classList.add("is-dismissed");
        function removeOverlay() {
          loadingOverlay.hidden = true;
          loadingOverlay.setAttribute("aria-hidden", "true");
        }
        // Fallback covers reduced-motion and background tabs, where the
        // transition may never fire. Both paths are safe to run twice.
        loadingOverlay.addEventListener("transitionend", removeOverlay, { once: true });
        setTimeout(removeOverlay, 600);
      }

      function showLoadingOverlayError() {
        if (!loadingOverlay) {
          return;
        }
        loadingOverlay.classList.add("has-error");
        var text = document.getElementById("loadingText");
        if (text) {
          text.textContent = "Could not load recipes. Please refresh the page - the error details are in the browser console (F12).";
        }
      }

      function initShell() {
        app.innerHTML =
          '<div class="app-shell">' +
            '<header class="topbar">' +
              '<button class="icon-button" type="button" data-action="open-menu" aria-label="Open menu"><span class="burger-lines"></span></button>' +
              "<div class='brand'><strong>Jonny's Kitchen</strong><span> </span></div>" +
              '<div class="topbar-actions">' +
                '<button class="text-button" type="button" data-action="open-search">Search</button>' +
                '<button class="text-button" type="button" data-action="open-kitchen">My Kitchen</button>' +
                '<button id="fullscreenButton" class="icon-button fullscreen-button hidden" type="button" data-action="toggle-fullscreen" aria-label="Enter fullscreen" title="Fullscreen">' + renderFullscreenIcon() + '</button>' +
              '</div>' +
            '</header>' +
            '<div id="sideBackdrop" class="side-backdrop" data-action="close-menu">' +
              '<aside class="side-menu" aria-label="Main menu" data-menu-panel>' +
                '<div class="menu-head"><h2>Menu</h2><button class="icon-button" type="button" data-action="close-menu" aria-label="Close menu">×</button></div>' +
                '<nav class="menu-list">' +
                  '<button type="button" data-action="home">Home</button>' +
                  '<button type="button" data-action="open-search">Search</button>' +
                  '<button type="button" data-action="open-my-list">My List</button>' +
                  '<button type="button" data-action="open-kitchen">My Kitchen</button>' +
                  renderCookingPreferenceButton() +
                  '<hr class="menu-separator">' +
                  '<button type="button" data-action="import">Import Data</button>' +
                  '<button type="button" data-action="export">Export Data</button>' +
                  '<button type="button" data-action="reset-request">Clear Local Data / Reset App</button>' +
                  '<hr class="menu-separator">' +
                  '<div class="menu-head"><i>Enjoying Jonny\'s Kitchen?</i></div>' +
                  '<a href="https://ko-fi.com/G2L623AJ3W" target="_blank"><img height="36" style="border:0px;height:36px;" src="https://storage.ko-fi.com/cdn/kofi6.png?v=6" border="0" alt="Buy Me a Coffee at ko-fi.com" /></a>' +
                '</nav>' +
              '</aside>' +
            '</div>' +
            '<main id="mainContent" class="main-content" tabindex="-1"></main>' +
            '<div id="timerMount"></div>' +
            '<div id="toast" class="toast" role="status" aria-live="polite"></div>' +
          '</div>';
      }

      // Startup order: prefer saved local state, then try the neighbouring JSON,
      // then fall back to a manual import panel for local-file browser limits.
      async function boot() {
        var stored = loadStoredState();
        if (stored) {
          state.data = stored;
          rebuildKitchenIndex();
          renderPanel({ type: "home" }, false);
          return;
        }

        try {
          var response = await fetch(SEED_FILE, { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Could not load " + SEED_FILE + ".");
          }
          var data = await response.json();
          state.data = ensureCatalogue(data);
          rebuildKitchenIndex();
          saveState("Loaded seed data.");
          renderPanel({ type: "home" }, false);
        } catch (error) {
          renderImportPanel(
            "Press F11 to fullscreen this app, if viewing from a PC/laptop.\n\n" + 
			"If this is your first time use, or you have changed browser, you must Import a JSON data file, to start.\n\n" +
			"Use an Exported JSON file that you downloaded previously, or select the default " + SEED_FILE +
			"\n\n Default seed file should be in the same folder as this index.html page. If you're viewing this page online, you can download the JSON file at:\n" +
			"https://aluca.neocities.org/recipe_seed.json"
          );
        }
      }

      // Event delegation keeps the single-page app resilient as panels are
      // replaced without rebinding every button and input.
      function attachGlobalEvents() {
        document.addEventListener("click", function (event) {
          if (suppressNextCarouselClick) {
            suppressNextCarouselClick = false;
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          var menuPanel = event.target.closest("[data-menu-panel]");
          var actionEl = event.target.closest("[data-action]");
          if (!actionEl) {
            return;
          }
          if (menuPanel && actionEl.dataset.action === "close-menu") {
            event.preventDefault();
          } else if (menuPanel && actionEl.dataset.action !== "close-menu") {
            event.preventDefault();
          } else {
            event.preventDefault();
          }
          handleAction(actionEl.dataset.action, actionEl, event);
        });

        attachCategoryCarouselDragEvents();

        document.addEventListener("input", function (event) {
          if (event.target.id === "searchInput") {
            searchQuery = event.target.value;
            renderSearchResults();
          }
          if (event.target.id === "kitchenInput") {
            kitchen.draft = event.target.value;
            renderKitchenSuggestionsDebounced();
          }
        });

        document.addEventListener("change", function (event) {
          if (event.target.id === "strictToggle") {
            kitchen.strict = event.target.checked;
            renderKitchenResultsArea();
          }
          if (event.target.id === "pantryAssumedToggle") {
            kitchen.pantryAssumed = event.target.checked;
            renderKitchenResultsArea();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeMenu();
          }
          if (event.key === "Enter" && event.target.id === "kitchenInput") {
            event.preventDefault();
            addKitchenIngredient(event.target.value);
          }
        });

        document.addEventListener("submit", function (event) {
          if (event.target.id === "editForm") {
            event.preventDefault();
            saveRecipeEdit();
          }
          if (event.target.id === "timerEditForm") {
            event.preventDefault();
            confirmTimerEdit();
          }
        });

        document.addEventListener("visibilitychange", function () {
          syncTimerFromClock(true);
          if (document.visibilityState === "visible" && timerState.running) {
            requestTimerWakeLock();
          }
          renderTimerPanel();
        });

        document.addEventListener("error", function (event) {
          if (event.target && event.target.matches && event.target.matches(".detail-image-wrap img")) {
            var wrap = event.target.closest(".detail-image-wrap");
            if (wrap) {
              wrap.replaceWith(renderDetailImagePlaceholderElement(wrap.dataset.fallbackTitle, wrap.dataset.fallbackColor));
            }
          }
        }, true);

        fileInput.addEventListener("change", handleFileImport);
      }

      // Homepage category carousels: drag the 5 visible cards left/right to
      // cycle through the category's full recipe list (the fixed "View all"
      // tile lives outside the .recipe-viewport, so it never moves). A short
      // drag moves 1 card; longer drags move more, capped at CAROUSEL_MAX_SHIFT.
      function attachCategoryCarouselDragEvents() {
        document.addEventListener("pointerdown", function (event) {
          if (event.button !== undefined && event.button > 0) {
            return;
          }
          if (cardCarousel.settling) {
            return;
          }
          var viewport = event.target.closest(".recipe-viewport");
          if (!viewport) {
            return;
          }
          var row = viewport.closest(".recipe-row.is-carousel-row");
          var track = viewport.querySelector(".recipe-track");
          if (!row || !track || !track.children.length) {
            return;
          }
          var gapValue = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 0;
          var slotWidth = track.children[0].getBoundingClientRect().width + gapValue;
          if (!slotWidth) {
            return;
          }
          cardCarousel.active = true;
          cardCarousel.captured = false;
          cardCarousel.pointerId = event.pointerId;
          cardCarousel.row = row;
          cardCarousel.track = track;
          cardCarousel.startX = event.clientX;
          cardCarousel.lastDx = 0;
          cardCarousel.slotWidth = slotWidth;
        });

        document.addEventListener("pointermove", function (event) {
          if (!cardCarousel.active || event.pointerId !== cardCarousel.pointerId) {
            return;
          }
          var maxOffset = CAROUSEL_MAX_SHIFT * cardCarousel.slotWidth;
          var dx = event.clientX - cardCarousel.startX;
          dx = Math.max(-maxOffset, Math.min(maxOffset, dx));
          cardCarousel.lastDx = dx;
          // Only claim the pointer once movement crosses the click threshold —
          // capturing on every press retargets the browser's synthesized click
          // event to the row, which breaks plain taps/clicks on a card.
          if (!cardCarousel.captured && Math.abs(dx) > CAROUSEL_CLICK_THRESHOLD) {
            cardCarousel.captured = true;
            cardCarousel.row.classList.add("is-dragging");
            if (cardCarousel.row.setPointerCapture) {
              try {
                cardCarousel.row.setPointerCapture(event.pointerId);
              } catch (error) {
                // Some browsers reject capture on elements without focus support; drag still works via document listeners.
              }
            }
          }
          if (cardCarousel.captured) {
            cardCarousel.track.style.transform = "translateX(" + dx + "px)";
          }
        });

        document.addEventListener("pointerup", endCarouselDrag);
        document.addEventListener("pointercancel", endCarouselDrag);

        function endCarouselDrag(event) {
          if (!cardCarousel.active || event.pointerId !== cardCarousel.pointerId) {
            return;
          }
          var row = cardCarousel.row;
          var track = cardCarousel.track;
          var dx = cardCarousel.lastDx;
          var slotWidth = cardCarousel.slotWidth;
          var wasCaptured = cardCarousel.captured;
          if (wasCaptured) {
            row.classList.remove("is-dragging");
            if (row.releasePointerCapture) {
              try {
                row.releasePointerCapture(cardCarousel.pointerId);
              } catch (error) {
                // Capture may already be released by the browser; ignore.
              }
            }
          }
          cardCarousel.active = false;
          cardCarousel.pointerId = null;

          if (!wasCaptured || Math.abs(dx) <= CAROUSEL_CLICK_THRESHOLD) {
            if (wasCaptured) {
              track.classList.add("is-animating");
              track.style.transform = "translateX(0px)";
              setTimeout(function () {
                track.classList.remove("is-animating");
              }, 200);
            }
            return;
          }

          suppressNextCarouselClick = true;
          var shiftCount = Math.min(CAROUSEL_MAX_SHIFT, Math.max(1, Math.round(Math.abs(dx) / slotWidth)));
          var signedShift = dx < 0 ? shiftCount : -shiftCount;
          var targetPx = shiftCount * slotWidth * (dx < 0 ? -1 : 1);

          cardCarousel.settling = true;
          track.classList.add("is-animating");
          track.style.transform = "translateX(" + targetPx + "px)";

          var settled = false;
          function finishSettle() {
            if (settled) {
              return;
            }
            settled = true;
            track.removeEventListener("transitionend", onTransitionEnd);
            var category = getCategoryById(row.dataset.categoryId);
            if (category && category.items.length) {
              var currentStart = parseInt(row.dataset.start, 10) || 0;
              var total = category.items.length;
              var newStart = ((currentStart + signedShift) % total + total) % total;
              row.dataset.start = String(newStart);
              row.dataset.total = String(total);
              track.classList.remove("is-animating");
              track.innerHTML = renderCarouselTrackCards(category.items, newStart);
              track.style.transform = "translateX(0px)";
            }
            cardCarousel.settling = false;
          }
          function onTransitionEnd(transitionEvent) {
            if (transitionEvent.target === track && transitionEvent.propertyName === "transform") {
              finishSettle();
            }
          }
          track.addEventListener("transitionend", onTransitionEnd);
          setTimeout(finishSettle, 260);
        }
      }

      function handleAction(action, el, event) {
        switch (action) {
          case "open-menu":
            openMenu();
            break;
          case "close-menu":
            closeMenu();
            break;
          case "home":
            closeMenu();
            navStack = [];
            renderPanel({ type: "home" }, false);
            break;
          case "open-search":
            closeMenu();
            navigate({ type: "search" });
            break;
          case "open-kitchen":
            closeMenu();
            navigate({ type: "kitchen" });
            break;
          case "toggle-fullscreen":
            toggleFullscreen();
            break;
          case "toggle-cooking-preference":
            toggleCookingPreference();
            break;
          case "open-my-list":
            closeMenu();
            navigate({ type: "category", categoryId: "my-list", title: "My List" });
            break;
          case "import":
            closeMenu();
            triggerImport();
            break;
          case "export":
            closeMenu();
            exportData();
            break;
          case "reset-request":
            closeMenu();
            pendingResetConfirm = true;
            renderResetConfirm();
            break;
          case "reset-cancel":
            pendingResetConfirm = false;
            renderPanel(currentPanel, false);
            break;
          case "reset-confirm":
            clearLocalData();
            break;
          case "back":
            goBack();
            break;
          case "view-category":
            navigate({ type: "category", categoryId: el.dataset.categoryId, title: el.dataset.categoryTitle });
            break;
          case "load-more-categories":
            loadMoreCategories();
            break;
          case "open-recipe":
            navigate({ type: "cook-card", recipeId: el.dataset.recipeId });
            break;
          case "expand-recipe":
            navigate({ type: "detail", recipeId: el.dataset.recipeId });
            break;
          case "start-timer":
            startRecipeTimer(el.dataset.recipeId);
            break;
          case "start-step-timer":
            startStepTimer(el.dataset.recipeId, el.dataset.stepIndex);
            break;
          case "toggle-timer-pause":
            toggleTimerPause();
            break;
          case "edit-timer":
            beginTimerEdit();
            break;
          case "cancel-timer-edit":
            cancelTimerEdit();
            break;
          case "toggle-list":
            toggleMyList(el.dataset.recipeId);
            break;
          case "set-rating":
            setRatingFromClick(el, event);
            break;
          case "clear-rating":
            updateRecipeRating(el.dataset.recipeId, 0);
            break;
          case "edit-recipe":
            renderPanel({ type: "detail", recipeId: el.dataset.recipeId, editing: true }, false);
            break;
          case "cancel-edit":
            renderPanel({ type: "detail", recipeId: el.dataset.recipeId }, false);
            break;
          case "save-edit":
            saveRecipeEdit();
            break;
          case "add-step":
            addEditableStepBlock();
            break;
          case "remove-step":
            removeEditableStep(el);
            break;
          case "kitchen-add-suggestion":
            addKitchenIngredient(el.dataset.ingredient);
            break;
          case "remove-kitchen-ingredient":
            removeKitchenIngredient(el.dataset.ingredient);
            break;
          default:
            break;
        }
      }

      function mainEl() {
        return document.getElementById("mainContent");
      }

      function openMenu() {
        document.getElementById("sideBackdrop").classList.add("is-open");
      }

      function closeMenu() {
        document.getElementById("sideBackdrop").classList.remove("is-open");
      }

      function renderCookingPreferenceButton() {
        return '<button id="cookingPreferenceButton" type="button" data-action="toggle-cooking-preference" aria-pressed="' + escapeAttr(preferAirFryer ? "true" : "false") + '">' + escapeHtml(cookingPreferenceLabel()) + '</button>';
      }

      function cookingPreferenceLabel() {
        return preferAirFryer ? "Preferring Air Fryer" : "Preferring Oven";
      }

      function loadCookingPreference() {
        try {
          var stored = localStorage.getItem(COOKING_PREFERENCE_KEY);
          return stored == null ? true : stored !== "false";
        } catch (error) {
          return true;
        }
      }

      function saveCookingPreference() {
        try {
          localStorage.setItem(COOKING_PREFERENCE_KEY, preferAirFryer ? "true" : "false");
        } catch (error) {
          // Preference persistence is best-effort; the current session still updates.
        }
      }

      function toggleCookingPreference() {
        preferAirFryer = !preferAirFryer;
        saveCookingPreference();
        updateCookingPreferenceButton();
        refreshCookingPreferenceViews();
      }

      function updateCookingPreferenceButton() {
        var button = document.getElementById("cookingPreferenceButton");
        if (!button) {
          return;
        }
        button.textContent = cookingPreferenceLabel();
        button.setAttribute("aria-pressed", preferAirFryer ? "true" : "false");
      }

      function refreshCookingPreferenceViews() {
        if (!state.data || currentPanel.type === "import" || (currentPanel.type === "detail" && currentPanel.editing)) {
          return;
        }
        renderPanel(currentPanel);
        updateCookingPreferenceButton();
      }

      function setupFullscreenButton() {
        var button = document.getElementById("fullscreenButton");
        if (!button) {
          return;
        }
        if (!isFullscreenSupported()) {
          button.classList.add("hidden");
          button.disabled = true;
          return;
        }
        button.classList.remove("hidden");
        document.addEventListener("fullscreenchange", updateFullscreenButton);
        document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
        updateFullscreenButton();
      }

      function isFullscreenSupported() {
        var root = document.documentElement;
        return Boolean(root && (root.requestFullscreen || root.webkitRequestFullscreen)) &&
          Boolean(document.exitFullscreen || document.webkitExitFullscreen);
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function updateFullscreenButton() {
        var button = document.getElementById("fullscreenButton");
        if (!button || button.disabled) {
          return;
        }
        var isActive = Boolean(fullscreenElement());
        button.setAttribute("aria-label", isActive ? "Exit fullscreen" : "Enter fullscreen");
        button.title = isActive ? "Exit fullscreen" : "Fullscreen";
      }

      function toggleFullscreen() {
        if (!isFullscreenSupported()) {
          return;
        }
        try {
          if (fullscreenElement()) {
            var exit = document.exitFullscreen || document.webkitExitFullscreen;
            var exitResult = exit.call(document);
            if (exitResult && exitResult.catch) {
              exitResult.catch(function () {});
            }
          } else {
            var target = app || document.documentElement;
            var request = target.requestFullscreen || target.webkitRequestFullscreen;
            var requestResult = request.call(target);
            if (requestResult && requestResult.catch) {
              requestResult.catch(function () {});
            }
          }
        } catch (error) {
          // Fullscreen can be blocked by browser policy; fail without breaking the app.
        }
      }

      function navigate(panel) {
        navStack.push(Object.assign({}, currentPanel));
        renderPanel(panel, false);
      }

      function goBack() {
        var panel = navStack.pop() || { type: "home" };
        renderPanel(panel, false);
      }

      // Central panel router. Every navigation target replaces main content
      // instead of moving to another HTML page.
      function renderPanel(panel) {
        pendingResetConfirm = false;
        // Re-rendering the panel already on screen (a rating change, "View
        // more") keeps the expanded category count; genuinely navigating to
        // home collapses it back to the first page.
        var isInPlaceRefresh = panel === currentPanel;
        currentPanel = panel || { type: "home" };
        if (currentPanel.type === "home" && !isInPlaceRefresh) {
          homeVisibleCategoryCount = HOME_CATEGORY_PAGE_SIZE;
        }
        if (!state.data && currentPanel.type !== "import") {
          renderImportPanel(
            "Automatic import failed. Please manually import " + SEED_FILE + " to start.\n\nAfter first import, this browser will remember you."
          );
          return;
        }
        if (currentPanel.type === "home") {
          renderHome();
        } else if (currentPanel.type === "category") {
          renderCategoryView(currentPanel);
        } else if (currentPanel.type === "cook-card") {
          renderCookCard(currentPanel);
        } else if (currentPanel.type === "detail") {
          renderDetail(currentPanel);
        } else if (currentPanel.type === "search") {
          renderSearchPanel();
        } else if (currentPanel.type === "kitchen") {
          renderKitchenPanel();
        } else {
          renderHome();
        }
        // Do not steal focus back from panels that intentionally focus an input.
        if (currentPanel.type !== "search") {
          mainEl().focus({ preventScroll: true });
        }
      }

      function renderResetConfirm() {
        var main = mainEl();
        var body = "";
        if (pendingResetConfirm) {
          body =
            '<div class="confirm-bar">' +
              '<div><strong>Clear local Cooking Journal data?</strong><div class="muted">This removes the saved catalogue, edits, ratings, and My List from this browser.</div></div>' +
              '<div class="import-actions">' +
                '<button type="button" class="danger-button" data-action="reset-confirm">Clear data</button>' +
                '<button type="button" class="ghost-button" data-action="reset-cancel">Cancel</button>' +
              '</div>' +
            '</div>';
        }
        main.insertAdjacentHTML("afterbegin", body);
      }

      function renderImportPanel(message) {
        currentPanel = { type: "import" };
        mainEl().innerHTML =
          '<section class="import-panel">' +
            "<h1>Jonny's Kitchen</h1>" +
            '<p class="subtitle">Whats cookin?</p>' +
            '<p>' + escapeHtml(message || "Import your recipe JSON file to start.").replace(/\n/g, '<br>') + '</p>' +
            '<div class="import-actions">' +
              '<button type="button" class="primary-button" data-action="import">Import JSON</button>' +
              '<button type="button" class="ghost-button" data-action="home">Try again</button>' +
            '</div>' +
          '</section>';
      }

      // Home uses generated category rows so added or removed recipes do not
      // require hard-coded recipe IDs.
      function renderHome() {
        var categories = buildCategories();
        var visibleCategories = categories.slice(0, homeVisibleCategoryCount);
        var shownRecipeKeys = new Set();
        var rows = visibleCategories.map(function (category) {
          return renderCategoryRow(category, shownRecipeKeys);
        }).filter(Boolean).join("");
        var viewMore = "";
        if (categories.length > visibleCategories.length) {
          viewMore =
            '<div class="view-more-row">' +
              '<button type="button" class="ghost-button" data-action="load-more-categories">View more categories</button>' +
            '</div>';
        }
        mainEl().innerHTML =
          '<section class="home-panel">' +
            '<div class="home-header">' +
              "<div><h1 class='home-title'>Jonny's Kitchen</h1><p class='subtitle'>What's Cookin'?</p></div>" +
              '<div class="count-pill">' + recipes().length + ' recipes</div>' +
            '</div>' +
            (rows || '<div class="empty-state">No recipes are loaded yet.</div>') +
            viewMore +
          '</section>';
      }

      function loadMoreCategories() {
        homeVisibleCategoryCount += HOME_CATEGORY_PAGE_SIZE;
        renderPanel(currentPanel, false);
      }

      function renderCategoryRow(category, shownRecipeKeys) {
        var visibleItems = selectHomepageCategoryItems(category, shownRecipeKeys);
        if (!visibleItems.length) {
          return "";
        }
        var isCarousel = category.items.length > 5;
        var rowInner;
        if (isCarousel) {
          var startIndex = category.items.indexOf(visibleItems[0]);
          if (startIndex < 0) {
            startIndex = 0;
          }
          var viewAll =
            '<button class="view-all-card" type="button" data-action="view-category" data-category-id="' +
            escapeAttr(category.id) + '" data-category-title="' + escapeAttr(category.name) + '">' +
              '<strong>View all</strong><span>' + escapeHtml(category.name) + '</span>' +
            '</button>';
          rowInner =
            '<div class="recipe-row is-carousel-row" data-category-id="' + escapeAttr(category.id) +
            '" data-start="' + startIndex + '" data-total="' + category.items.length + '">' +
              '<div class="recipe-viewport"><div class="recipe-track">' +
                renderCarouselTrackCards(category.items, startIndex) +
              '</div></div>' +
              viewAll +
            '</div>';
        } else {
          rowInner = '<div class="recipe-row">' + visibleItems.map(renderRecipeCard).join("") + '</div>';
        }
        return (
          '<section class="category-row" aria-label="' + escapeAttr(category.name) + '">' +
            '<div class="row-heading">' +
              '<h2><button class="row-heading-link" type="button" data-action="view-category" data-category-id="' +
              escapeAttr(category.id) + '" data-category-title="' + escapeAttr(category.name) + '">' +
                escapeHtml(category.name) +
              '</button></h2>' +
              '<span class="count-pill">' + category.items.length + '</span>' +
            '</div>' +
            rowInner +
          '</section>'
        );
      }

      function renderCarouselTrackCards(items, startIndex) {
        var total = items.length;
        var html = "";
        for (var i = -CAROUSEL_MAX_SHIFT; i <= CAROUSEL_VISIBLE - 1 + CAROUSEL_MAX_SHIFT; i++) {
          var idx = ((startIndex + i) % total + total) % total;
          html += renderRecipeCard(items[idx]);
        }
        return html;
      }

      function selectHomepageCategoryItems(category, shownRecipeKeys) {
        if (!shownRecipeKeys) {
          return category.items.slice(0, 5);
        }
        var selected = [];
        var selectedKeys = new Set();
        category.items.some(function (recipe) {
          var key = recipeDedupeKey(recipe);
          if (shownRecipeKeys.has(key)) {
            return false;
          }
          selected.push(recipe);
          selectedKeys.add(key);
          shownRecipeKeys.add(key);
          return selected.length >= 5;
        });
        // Not enough recipes unique to this category to hit the minimum of 5 —
        // top up with recipes already shown elsewhere on the page so the row
        // still displays 5 whenever the category actually has that many.
        if (selected.length < 5) {
          category.items.some(function (recipe) {
            var key = recipeDedupeKey(recipe);
            if (selectedKeys.has(key)) {
              return false;
            }
            selected.push(recipe);
            selectedKeys.add(key);
            return selected.length >= 5;
          });
        }
        return selected;
      }

      function recipeDedupeKey(recipe) {
        return recipe && recipe.id != null ? "id:" + String(recipe.id) : recipe;
      }

      function renderCategoryView(panel) {
        var category = getCategoryById(panel.categoryId) || {
          id: panel.categoryId,
          name: panel.title || "Recipes",
          items: panel.categoryId === "my-list" ? recipes().filter(isInMyList) : []
        };
        mainEl().innerHTML =
          '<section class="category-panel">' +
            '<div class="back-row"><button class="ghost-button" type="button" data-action="back">Back</button></div>' +
            '<div class="panel-header"><div><h1>' + escapeHtml(category.name) + '</h1><p class="subtitle">' + category.items.length + ' recipes</p></div></div>' +
            (category.items.length ?
              '<div class="card-grid">' + category.items.map(renderRecipeCard).join("") + '</div>' :
              '<div class="empty-state">No recipes here yet.</div>') +
          '</section>';
      }

      function renderRecipeCard(recipe) {
        var title = displayValue(recipe.title, "Untitled recipe");
        var cookingInfo = getPrimaryCookingInfo(recipe);
        var color = stableRecipeColor(recipe);
        var imagePath = getRecipeImagePath(recipe);
        var cardClass = imagePath ? "recipe-card has-image" : "recipe-card";
        var style = "background-color: " + color + ";";
        if (imagePath) {
          style += ' background-image: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.46)), url("' + cssUrl(imagePath) + '");';
        }
        return (
          '<button class="' + cardClass + '" type="button" data-action="open-recipe" data-recipe-id="' + escapeAttr(recipe.id) + '" style="' + escapeAttr(style) + '">' +
            '<span class="card-content">' +
              '<span class="card-title">' + escapeHtml(title) + '</span>' +
              '<span class="card-cook-badge">' + escapeHtml(cookingInfo.label) + '</span>' +
              renderStars(getRating(recipe)) +
            '</span>' +
          '</button>'
        );
      }

      function renderTimerButton(recipe) {
        return (
          '<button class="round-button timer-button" type="button" data-action="start-timer" data-recipe-id="' + escapeAttr(recipe.id) + '" aria-label="Start timer for ' + escapeAttr(displayValue(recipe.title, "recipe")) + '" title="Start timer">' +
            renderTimerIcon() +
          '</button>'
        );
      }

      function renderTimerIcon() {
        return '<svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v5l3 2"></path><path d="M9 2h6"></path><path d="M12 2v3"></path></svg>';
      }

      function renderFullscreenIcon() {
        return '<svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5"></path><path d="M16 3h5v5"></path><path d="M21 16v5h-5"></path><path d="M8 21H3v-5"></path></svg>';
      }

      function renderCookCard(panel) {
        var recipe = getRecipeById(panel.recipeId);
        if (!recipe) {
          mainEl().innerHTML =
            '<section class="cook-card-panel"><div class="back-row"><button class="ghost-button" type="button" data-action="back">Back</button></div><div class="empty-state">Recipe not found.</div></section>';
          return;
        }
        var title = displayValue(recipe.title, "Untitled recipe");
        var cookingInfo = getPrimaryCookingInfo(recipe);
        mainEl().innerHTML =
          '<section class="cook-card-panel">' +
            '<div class="back-row"><button class="ghost-button" type="button" data-action="back">Back</button></div>' +
            '<div class="cook-card">' +
              renderDetailImage(recipe) +
              '<div class="cook-card-body">' +
                '<div class="cook-card-head">' +
                  '<div class="cook-card-title-block">' +
                    '<h1>' + escapeHtml(title) + '</h1>' +
                    '<div class="cook-card-label">' + escapeHtml(cookingInfo.label) + '</div>' +
                  '</div>' +
                  renderTimerButton(recipe) +
                '</div>' +
                renderCookSummary(cookingInfo) +
                '<section><h2>Ingredients</h2>' + renderCookIngredientList(recipe) + '</section>' +
                '<div class="cook-card-actions">' +
                  '<button type="button" class="primary-button" data-action="expand-recipe" data-recipe-id="' + escapeAttr(recipe.id) + '">Expand</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</section>';
      }

      function renderCookSummary(info) {
        var chips = [];
        if (info.device) {
          chips.push(info.device);
        }
        if (info.temperature) {
          chips.push(info.temperature);
        }
        if (info.time) {
          chips.push(info.time);
        }
        if (!chips.length) {
          chips.push(info.label);
        }
        return '<div class="cook-summary">' + chips.map(function (chip) {
          return '<span class="cook-chip">' + escapeHtml(chip) + '</span>';
        }).join("") + '</div>';
      }

      function renderCookIngredientList(recipe) {
        var ingredients = getIngredientLabels(recipe);
        if (!ingredients.length) {
          return '<p class="muted">Ingredients not listed.</p>';
        }
        return '<ul class="cook-ingredients">' + ingredients.map(function (ingredient) {
          return '<li>' + escapeHtml(ingredient) + '</li>';
        }).join("") + '</ul>';
      }

      function createEmptyTimerState() {
        return {
          visible: false,
          running: false,
          expired: false,
          remainingSeconds: 0,
          durationSeconds: 0,
          endAt: null,
          recipeId: null,
          label: "Timer",
          sourceLabel: ""
        };
      }

      function timerMount() {
        return document.getElementById("timerMount");
      }

      function startRecipeTimer(recipeId) {
        var recipe = getRecipeById(recipeId);
        if (!recipe) {
          return;
        }
        unlockTimerAudio();
        stopTimerAlarmSound();
        releaseTimerWakeLock();
        var cookingInfo = getPrimaryCookingInfo(recipe);
        var seconds = parseTimerSeconds(cookingInfo.time || cookingInfo.label);
        if (seconds == null) {
          seconds = 0;
        }
        timerEditing = false;
        timerEditWasRunning = false;
        timerState = {
          visible: true,
          running: seconds > 0,
          expired: false,
          remainingSeconds: seconds,
          durationSeconds: seconds,
          endAt: seconds > 0 ? Date.now() + seconds * 1000 : null,
          recipeId: recipe.id,
          label: displayValue(recipe.title, "Timer"),
          sourceLabel: cookingInfo.label || ""
        };
        saveTimerState();
        renderTimerPanel();
        if (timerState.running) {
          ensureTimerTicker();
          requestTimerWakeLock();
        }
      }

      function startStepTimer(recipeId, stepIndex) {
        var recipe = getRecipeById(recipeId);
        var index = Number(stepIndex);
        var steps = Array.isArray(recipe && recipe.method_steps) ? recipe.method_steps : [];
        var step = Number.isInteger(index) ? steps[index] : null;
        var minutes = toNumber(step && step.time_minutes);
        if (!recipe || minutes <= 0) {
          return;
        }
        var seconds = Math.max(1, Math.round(minutes * 60));
        unlockTimerAudio();
        stopTimerAlarmSound();
        releaseTimerWakeLock();
        timerEditing = false;
        timerEditWasRunning = false;
        timerState = {
          visible: true,
          running: true,
          expired: false,
          remainingSeconds: seconds,
          durationSeconds: seconds,
          endAt: Date.now() + seconds * 1000,
          recipeId: recipe.id,
          label: displayValue(recipe.title, "Timer"),
          sourceLabel: "Step " + (index + 1) + " - " + formatStepTimerDuration(minutes)
        };
        saveTimerState();
        renderTimerPanel();
        ensureTimerTicker();
        requestTimerWakeLock();
      }

      function restoreTimerState() {
        try {
          var raw = localStorage.getItem(TIMER_KEY);
          if (!raw) {
            renderTimerPanel();
            return;
          }
          var parsed = JSON.parse(raw);
          timerState = Object.assign(createEmptyTimerState(), parsed || {});
          timerState.remainingSeconds = Math.max(0, Math.round(Number(timerState.remainingSeconds) || 0));
          timerState.durationSeconds = Math.max(0, Math.round(Number(timerState.durationSeconds) || timerState.remainingSeconds));
          timerState.endAt = timerState.endAt ? Number(timerState.endAt) : null;
          if (timerState.running) {
            syncTimerFromClock(false);
          }
          renderTimerPanel();
          if (timerState.running) {
            ensureTimerTicker();
            requestTimerWakeLock();
          }
        } catch (error) {
          timerState = createEmptyTimerState();
          renderTimerPanel();
        }
      }

      function saveTimerState() {
        try {
          if (!timerState.visible) {
            localStorage.removeItem(TIMER_KEY);
            return;
          }
          localStorage.setItem(TIMER_KEY, JSON.stringify(timerState));
        } catch (error) {
          // Timer persistence is best-effort; the timer still works in memory.
        }
      }

      function renderTimerPanel() {
        var mount = timerMount();
        if (!mount) {
          return;
        }
        setTimerVisibleClass(timerState.visible);
        if (!timerState.visible) {
          mount.innerHTML = "";
          stopTimerTicker();
          return;
        }
        if (timerEditing) {
          mount.innerHTML =
            '<form id="timerEditForm" class="timer-panel" autocomplete="off">' +
              '<input id="timerEditInput" class="timer-edit-input" type="text" inputmode="numeric" aria-label="Timer time" value="' + escapeAttr(formatTimerClock(timerState.remainingSeconds)) + '">' +
              '<button class="primary-button" type="submit">Set</button>' +
              '<button class="ghost-button" type="button" data-action="cancel-timer-edit">Cancel</button>' +
            '</form>';
          return;
        }
        var controlLabel = timerState.expired ? "Stop" : (timerState.running ? "Pause" : (timerState.remainingSeconds > 0 ? "Resume" : "Stop"));
        var controlClass = timerState.expired ? "danger-button" : "primary-button";
        var label = timerState.expired ? "Time is up" : [timerState.label, timerState.sourceLabel].filter(Boolean).join(" - ");
        mount.innerHTML =
          '<div class="timer-panel' + (timerState.expired ? ' is-expired' : '') + '" role="timer" aria-live="polite">' +
            '<button class="timer-display-button" type="button" data-action="edit-timer" aria-label="Edit timer">' +
              '<span class="timer-time">' + escapeHtml(formatTimerClock(timerState.remainingSeconds)) + '</span>' +
              '<span class="timer-label">' + escapeHtml(label || "Timer") + '</span>' +
            '</button>' +
            '<button class="' + controlClass + ' timer-control" type="button" data-action="toggle-timer-pause">' + controlLabel + '</button>' +
          '</div>';
        if (timerState.running) {
          ensureTimerTicker();
        }
      }

      function setTimerVisibleClass(isVisible) {
        if (document.body && document.body.classList) {
          document.body.classList.toggle("timer-visible", Boolean(isVisible));
        }
      }

      function ensureTimerTicker() {
        if (timerInterval) {
          return;
        }
        timerInterval = setInterval(tickTimer, 1000);
      }

      function stopTimerTicker() {
